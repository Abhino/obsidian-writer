<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0d1513" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="../icon-192.png" />
<title>Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* Same palette as the capture app — this is the same system, seen from a
     desk instead of a phone. */
  :root{
    --bg:#0d1513; --bg-2:#111d1a; --surface:#15211e; --surface-2:#1b2925;
    --line:#25332e; --ink:#e9e6da; --muted:#8a978f; --faint:#5c6863;
    --accent:#e3a857; --accent-dim:#b9863f;
    --ok:#7fb88a; --warn:#d98a6a;
    --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
    --ui:"Hanken Grotesk",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink); font-family:var(--ui);
    -webkit-font-smoothing:antialiased; display:flex; flex-direction:column;
    min-height:100dvh; overflow:hidden;
  }

  /* ── header ───────────────────────────── */
  header{
    display:flex; align-items:center; gap:.7rem; flex:none;
    padding:.6rem 1.1rem; border-bottom:1px solid var(--line);
  }
  .iconbtn{
    background:none; border:1px solid transparent; color:var(--muted);
    font:inherit; font-size:1rem; padding:.2rem .5rem; border-radius:7px;
    cursor:pointer; display:none;
  }
  .iconbtn:hover{color:var(--ink); border-color:var(--line)}
  .mark{font-size:1.05rem; font-weight:700; letter-spacing:-.02em; flex:none}
  .omni{position:relative; flex:1; max-width:520px; margin:0 auto; display:flex; align-items:center}
  .omni input{
    width:100%; background:var(--surface); border:1px solid var(--line);
    border-radius:11px; color:var(--ink); font-family:var(--mono); font-size:.82rem;
    padding:.5rem 2.9rem .5rem .8rem; outline:none;
  }
  .omni input:focus{border-color:var(--accent-dim)}
  .omni input::placeholder{color:var(--faint)}
  .omni kbd{
    position:absolute; right:.55rem; font-family:var(--mono); font-size:.66rem;
    color:var(--faint); border:1px solid var(--line); border-radius:6px; padding:.05rem .35rem;
    pointer-events:none;
  }
  .omnidrop{
    position:absolute; top:calc(100% + 6px); left:0; right:0; z-index:35;
    background:var(--bg-2); border:1px solid var(--line); border-radius:12px;
    overflow:hidden; box-shadow:0 12px 30px rgba(0,0,0,.45);
  }
  .omnirow{
    display:flex; gap:.6rem; align-items:baseline; width:100%; text-align:left;
    background:none; border:0; color:var(--ink); font:inherit; font-size:.8rem;
    padding:.5rem .8rem; cursor:pointer;
  }
  .omnirow:hover{background:var(--surface-2)}
  .omnirow .omniwhere{font-family:var(--mono); font-size:.64rem; color:var(--faint); flex:none; min-width:5.5rem}
  .nav{display:flex; align-items:center; gap:.2rem; flex:none}
  .nav button{
    background:none; border:1px solid transparent; color:var(--muted);
    font:inherit; font-size:.9rem; padding:.2rem .5rem; border-radius:7px; cursor:pointer;
  }
  .nav button:hover{color:var(--ink); border-color:var(--line)}
  .day-label{font-weight:600; font-size:.95rem; min-width:9.5rem; text-align:center}
  .day-label .rel{color:var(--faint); font-weight:400; font-size:.8rem; margin-left:.35rem}
  .hdr-right{margin-left:auto; display:flex; align-items:center; gap:.5rem; flex:none}
  .status-txt{font-size:.72rem; color:var(--muted); font-variant-numeric:tabular-nums}
  .dot{width:7px; height:7px; border-radius:50%; background:var(--faint)}
  .dot.online{background:var(--ok)} .dot.offline{background:var(--warn)}
  .ghost{
    background:var(--surface-2); border:1px solid var(--line); color:var(--muted);
    font:inherit; font-size:.76rem; padding:.32rem .6rem; border-radius:8px; cursor:pointer;
  }
  .ghost:hover{color:var(--ink); border-color:var(--accent-dim)}
  .ghost.on{color:var(--accent); border-color:var(--accent-dim)}
  .ghost:disabled{opacity:.45; cursor:default}
  .ghost.mini{font-size:.66rem; padding:.15rem .45rem}
  .ghost.save{background:var(--accent); color:#1a1206; border-color:var(--accent); font-weight:600}

  /* ── layout: sidebar | center | rail ──── */
  .shell{
    flex:1; min-height:0; display:grid;
    grid-template-columns:198px minmax(0,1fr) 292px;
    gap:1rem; padding:1rem 1.1rem 1.2rem; overflow:hidden;
  }
  .side{
    min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:.15rem;
    scrollbar-width:thin; scrollbar-color:var(--line) transparent; padding-right:.2rem;
  }
  .navitem{
    display:flex; align-items:center; gap:.55rem; width:100%;
    background:none; border:1px solid transparent; color:var(--muted);
    font:inherit; font-size:.86rem; padding:.44rem .65rem; border-radius:9px;
    cursor:pointer; text-align:left;
  }
  .navitem:hover{color:var(--ink); background:var(--surface)}
  .navitem.on{color:var(--ink); background:var(--surface-2); font-weight:600}
  .navitem .n{margin-left:auto; font-family:var(--mono); font-size:.68rem; color:var(--faint); font-weight:400}
  .side-sec{
    font-size:.64rem; font-weight:700; letter-spacing:.09em; text-transform:uppercase;
    color:var(--faint); padding:.9rem .65rem .25rem; display:flex; align-items:center;
  }
  .side-sec .pinadd{
    margin-left:auto; background:none; border:1px solid var(--line); color:var(--faint);
    font:inherit; font-size:.8rem; line-height:1; border-radius:7px; padding:.1rem .45rem; cursor:pointer;
  }
  .side-sec .pinadd:hover{color:var(--accent); border-color:var(--accent-dim)}
  .dot2{width:8px; height:8px; border-radius:50%; flex:none; background:var(--faint)}
  .navitem.t-urgent .dot2{background:var(--warn)}
  .navitem.t-home .dot2{background:#7fb88a}
  .navitem.t-phone .dot2{background:#7fb4c8}
  .navitem.t-call .dot2{background:#b7a0dc}
  .side-foot{margin-top:auto; padding:.8rem .65rem .2rem; font-size:.68rem; color:var(--faint)}
  #sideScrim{display:none}

  .main{
    min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:.8rem;
    scrollbar-width:thin; scrollbar-color:var(--line) transparent; padding-right:.2rem;
  }
  .main::-webkit-scrollbar, .side::-webkit-scrollbar, .rail::-webkit-scrollbar{width:8px}
  .main::-webkit-scrollbar-thumb, .side::-webkit-scrollbar-thumb, .rail::-webkit-scrollbar-thumb{
    background:var(--line); border-radius:4px}
  .rail{
    min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:.8rem;
    scrollbar-width:thin; scrollbar-color:var(--line) transparent; padding-right:.2rem;
  }

  .dayhead{display:flex; align-items:baseline; gap:.7rem; padding:.1rem .2rem 0}
  .dayhead h1{margin:0; font-size:1.5rem; font-weight:700; letter-spacing:-.02em}
  .dayhead .daysub{color:var(--faint); font-size:.8rem}
  .dayhead .ghost{margin-left:auto}
  .daysum{display:flex; align-items:center; gap:.6rem; padding:.05rem .2rem .2rem;
          font-size:.78rem; color:var(--muted)}
  .prog{display:flex; gap:4px; margin-left:auto}
  .prog i{width:14px; height:6px; border-radius:3px; border:1px solid var(--ok); display:block}
  .prog i.f{background:var(--ok)}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:14px;
        padding:.6rem .8rem .7rem}
  .card.day{padding:.7rem .9rem 1rem}
  .card-head{
    display:flex; align-items:baseline; gap:.5rem; padding:.15rem 0 .45rem;
    font-size:.68rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase;
    color:var(--muted);
  }
  .card-head .n{margin-left:auto; font-family:var(--mono); font-size:.68rem;
                letter-spacing:0; color:var(--faint); font-weight:500; text-transform:none}
  .card-head .path{font-family:var(--mono); font-size:.62rem; letter-spacing:0;
                   text-transform:none; color:var(--faint); font-weight:400}
  .rail-head{
    display:flex; align-items:baseline; gap:.5rem; padding:.15rem 0 .45rem;
    font-size:.68rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase;
    color:var(--muted);
  }
  .rail-head .rail-side{margin-left:auto; font-family:var(--mono); font-size:.66rem;
                        letter-spacing:0; text-transform:none; color:var(--muted); font-weight:500}

  /* ── projects ─────────────── */
  .projcard{
    border:1px solid var(--line); border-radius:11px; padding:.45rem .55rem .5rem;
    margin:.4rem 0; background:var(--bg-2);
  }
  .projhead{display:flex; align-items:baseline; gap:.45rem; flex-wrap:wrap}
  .projhead .name{font-weight:600; font-size:.86rem}
  .projhead .n{font-family:var(--mono); font-size:.64rem; color:var(--faint)}
  .pill{
    font-family:var(--mono); font-size:.6rem; border:1px solid var(--line);
    border-radius:999px; padding:.05rem .4rem; color:var(--muted);
  }
  .pill.active{color:var(--ok); border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
  .pill.stalled{color:var(--warn); border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
  .pill.future{color:var(--accent); border-color:var(--accent-dim)}
  .projhead .addnext{margin-left:auto}
  .projmeta{font-size:.66rem; color:var(--faint); padding:.15rem 0 0}
  .projfilter{display:flex; gap:.35rem; padding:.15rem 0 .5rem}
  .intro{font-size:.76rem; color:var(--muted); padding:.15rem .1rem .45rem; line-height:1.5}
  .intro code{font-family:var(--mono); font-size:.7rem; color:var(--accent-dim)}

  /* ── day events (the day itself is one flat lane; blocks went away) ── */
  .evt{font-family:var(--mono); font-size:.74rem; color:var(--muted);
       display:flex; gap:.5rem; padding:.2rem 0 .2rem .1rem}
  .evt .when{color:var(--accent-dim); font-weight:600; flex:none}

  /* ── a list of task lines ─────────────── */
  .lane{min-height:34px; border-radius:8px; padding:1px 0}
  .lane.mini{min-height:26px}
  .row{
    display:flex; align-items:flex-start; gap:.5rem; padding:.34rem .4rem;
    border-radius:8px; background:var(--surface);
    border:1px solid transparent;
  }
  .main .card .row:hover, .rail .card .row:hover{border-color:var(--line); background:var(--surface-2)}
  .row .cb{
    flex:none; width:17px; height:17px; border:1.5px solid var(--faint); border-radius:5px;
    margin-top:.1rem; display:flex; align-items:center; justify-content:center;
    color:transparent; cursor:pointer;
  }
  .row.done .cb{background:var(--ok); border-color:var(--ok); color:#10231a}
  .row.pending .cb{border-color:var(--accent)}
  .row .tx{font-family:var(--mono); font-size:.82rem; line-height:1.45; word-break:break-word; flex:1}
  .row.done .tx{color:var(--faint); text-decoration:line-through}
  .row .tx[contenteditable="true"]{outline:none; border-bottom:1px solid var(--accent-dim)}
  .row.plain .cb{display:none}
  .row.plain .tx{color:var(--muted)}
  .row.static{cursor:default}
  .badge{display:inline-block; font-family:var(--mono); font-size:.6rem; color:var(--accent-dim);
         border:1px solid var(--line); border-radius:5px; padding:0 .28rem; margin-left:.4rem;
         vertical-align:1px}
  .badge.proj{color:var(--accent); border-color:var(--accent-dim)}
  .badge.route{color:var(--faint)}
  .badge.src{margin-left:auto; color:var(--faint)}
  .rowacts{display:flex; gap:.15rem; flex:none; opacity:0; transition:opacity .12s}
  .row:hover .rowacts{opacity:1}
  .rowacts button{background:none; border:none; color:var(--faint); cursor:pointer;
                  font-size:.78rem; padding:0 .2rem; line-height:1}
  .rowacts button:hover{color:var(--accent)}
  .rowacts button.x{font-size:.95rem}
  .rowacts button.x:hover{color:var(--warn)}
  .row.gone .tx{color:var(--faint); text-decoration:line-through}
  .row:focus-visible{outline:2px solid var(--accent-dim); outline-offset:-2px}
  .row.dim{opacity:.28}
  .badge.tg{border-radius:6px; margin-left:.4rem; color:var(--tc,var(--faint)); border-color:transparent;
    background:color-mix(in srgb,var(--tc,#888) 14%,transparent)}
  .t-urgent{--tc:var(--warn)} .t-home{--tc:#7fb88a} .t-phone{--tc:#7fb4c8}
  .t-call{--tc:#b7a0dc}

  /* ── group headings inside a card ─────── */
  .grp{display:flex; align-items:baseline; gap:.4rem; padding:.45rem .1rem .1rem;
       font-size:.74rem; color:var(--accent); font-weight:600; cursor:pointer}
  .grp .chev{color:var(--faint); font-size:.6rem}
  .grp .n{margin-left:auto; font-family:var(--mono); font-size:.64rem; color:var(--faint); font-weight:400}
  .grp.date{color:var(--muted)}
  .grp.date.overdue{color:var(--warn)}
  .sub{font-size:.66rem; color:var(--faint); padding:.2rem .1rem 0}
  .adder{
    width:100%; background:none; border:none; border-top:1px dashed var(--line);
    color:var(--faint); font:inherit; font-family:var(--mono); font-size:.76rem;
    padding:.35rem .4rem; margin-top:.2rem; outline:none;
  }
  .adder:focus{color:var(--ink); border-top-color:var(--accent-dim)}
  .adder::placeholder{color:var(--faint)}
  .empty{color:var(--faint); font-size:.78rem; padding:.5rem .4rem}

  /* ── move sheet ───────────────────────── */
  .mvscrim{position:fixed; inset:0; background:rgba(4,8,7,.6); z-index:40;
           opacity:0; pointer-events:none; transition:opacity .2s}
  .mvscrim.open{opacity:1; pointer-events:auto}
  .mv{
    display:flex; flex-direction:column; gap:.1rem; position:fixed; z-index:41;
    top:50%; left:50%; transform:translate(-50%,-50%) scale(.97);
    width:min(440px,92vw); max-height:80dvh; overflow-y:auto;
    background:var(--bg-2); border:1px solid var(--line); border-radius:16px;
    padding:.8rem; opacity:0; pointer-events:none; visibility:hidden;
    transition:opacity .2s, transform .2s, visibility .2s;
  }
  .mv.open{opacity:1; pointer-events:auto; visibility:visible;
           transform:translate(-50%,-50%) scale(1)}
  .mv .mvt{color:var(--muted); font-size:.82rem; padding:.2rem .5rem .6rem;
           border-bottom:1px solid var(--line); margin-bottom:.3rem}
  .mv .mvsec{font-size:.62rem; font-weight:700; letter-spacing:.08em;
             text-transform:uppercase; color:var(--faint);
             padding:.75rem .6rem .25rem}
  .mv button{background:none; border:0; color:var(--ink); font:inherit;
             text-align:left; padding:.65rem .6rem; min-height:42px;
             border-radius:9px}
  .mv button:hover, .mv button:active{background:var(--surface-2)}
  .mv button .sub{display:block; font-family:var(--mono); font-size:.62rem;
                  color:var(--faint); margin-top:.1rem}
  .mv .danger{color:var(--warn)}
  .mv .cancel{color:var(--faint)}

  /* ── toast + sheet ────────────────────── */
  .toast{
    position:fixed; left:50%; transform:translateX(-50%); bottom:4.4rem;
    background:var(--surface-2); border:1px solid var(--line); color:var(--ink);
    font-size:.82rem; padding:.55rem .95rem; border-radius:10px; z-index:30;
    opacity:0; transition:opacity .2s; pointer-events:none; max-width:70vw;
  }
  .toast.show{opacity:1; pointer-events:auto}
  .toast .undo{background:none; border:none; color:var(--accent); font:inherit;
               font-weight:700; margin-left:.7rem; cursor:pointer; padding:0}
  .toast.bad{border-color:var(--warn)}
  .scrim{position:fixed; inset:0; background:rgba(4,8,7,.6); z-index:10;
         opacity:0; pointer-events:none; transition:opacity .2s}
  .scrim.open{opacity:1; pointer-events:auto}
  .sheet{
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%) scale(.97);
    width:min(440px,92vw); z-index:11; background:var(--bg-2);
    border:1px solid var(--line); border-radius:16px; padding:1.1rem 1.25rem 1.3rem;
    opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
  }
  .sheet.open{opacity:1; pointer-events:auto; transform:translate(-50%,-50%) scale(1)}
  .sheet h2{margin:.1rem 0 .8rem; font-size:1rem; font-weight:700}
  .sheet label{display:block; font-size:.74rem; color:var(--muted); margin:.8rem 0 .3rem; font-weight:600}
  .sheet input{width:100%; background:var(--surface); border:1px solid var(--line);
               border-radius:9px; color:var(--ink); font-family:var(--mono);
               font-size:.85rem; padding:.55rem .7rem; outline:none}
  .sheet input:focus{border-color:var(--accent-dim)}
  .rowb{display:flex; gap:.6rem; align-items:center; margin-top:1.1rem}
  .save{margin-left:auto; background:var(--accent); color:#1a1206; border:none;
        border-radius:9px; font-weight:700; font-size:.85rem; padding:.55rem 1rem; cursor:pointer}
  .datelist{display:flex; flex-wrap:wrap; gap:.4rem; margin-top:.3rem}
  .datelist button{background:var(--surface); border:1px solid var(--line); color:var(--ink);
                   font:inherit; font-size:.8rem; padding:.4rem .6rem; border-radius:8px; cursor:pointer}
  .datelist button:hover{border-color:var(--accent-dim)}
  .warnbar{background:var(--surface-2); border:1px solid var(--warn); border-radius:10px;
           color:var(--warn); font-size:.76rem; padding:.45rem .7rem; margin-bottom:.2rem}
  @media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important}}

  /* ── floating save bar ────────────────── */
  .savebar{
    position:fixed; left:50%; transform:translateX(-50%); bottom:1.1rem; z-index:28;
    display:flex; align-items:center; gap:.7rem; background:var(--bg-2);
    border:1px solid var(--accent-dim); border-radius:14px; padding:.55rem .8rem;
    box-shadow:0 12px 30px rgba(0,0,0,.45);
  }
  .savebar span{font-size:.78rem; color:var(--muted)}

  @media (hover:none){
    .rowacts{opacity:1}
    .row [contenteditable]{-webkit-user-select:text; user-select:text}
  }

  /* ── narrow: rail stacks under the day ── */
  @media (max-width:1080px){
    body{overflow:visible; min-height:100dvh}
    .shell{display:block; overflow:visible; padding:.8rem}
    .main, .side, .rail{overflow:visible}
    .rail{margin-top:1rem; max-width:560px}
  }

  /* ── phone ───────────────────────────── */
  @media (max-width:860px){
    body{padding-bottom:calc(5.6rem + env(safe-area-inset-bottom,0px))}
    header{position:sticky; top:0; z-index:20; background:var(--bg); flex-wrap:wrap;
           gap:.4rem .6rem; padding:calc(.5rem + env(safe-area-inset-top,0px)) .8rem .5rem}
    .iconbtn{display:inline-block; order:1}
    .mark{order:2}
    .hdr-right{order:3; margin-left:auto; gap:.35rem}
    .omni{order:4; flex:1 0 100%; max-width:none}
    .nav{order:5}
    .ctx, .status-txt{display:none}
    #deferBtn{display:none}
    .day-label{min-width:7rem}
    .ghost, .nav button, .iconbtn{min-height:36px; min-width:36px}
    .side{
      position:fixed; top:0; bottom:0; left:0; width:min(78vw,290px); z-index:42;
      background:var(--bg-2); border-right:1px solid var(--line); padding:.9rem .6rem;
      transform:translateX(-105%); transition:transform .22s;
    }
    .side.open{transform:none}
    #sideScrim{display:block; position:fixed; inset:0; background:rgba(4,8,7,.6); z-index:41;
               opacity:0; pointer-events:none; transition:opacity .2s}
    #sideScrim.open{opacity:1; pointer-events:auto}
    .side-foot{margin-top:auto}
    .savebar{bottom:calc(.9rem + env(safe-area-inset-bottom,0px)); max-width:94vw}
    .row{min-height:44px; padding:.3rem .4rem}
    .rowacts{gap:.1rem}
    .rowacts button{min-width:36px; min-height:36px; font-size:1.05rem}
    .rowacts button:not(.mvb):not(.x){display:none}
    input, textarea, [contenteditable]{font-size:16px}
    .sheet{width:calc(100vw - 1.5rem); max-height:86dvh; overflow-y:auto}
    .toast{bottom:calc(5.8rem + env(safe-area-inset-bottom,0px)); max-width:92vw}
    .mv{top:auto; left:0; right:0; bottom:0; transform:translateY(105%);
        width:auto; border-radius:18px 18px 0 0;
        padding:.8rem .8rem calc(.8rem + env(safe-area-inset-bottom,0px))}
    .mv.open{transform:none}
    .mv button{min-height:48px; padding:.8rem .6rem}
  }
</style>
</head>
<body>
  <header>
    <button class="iconbtn" id="menuBtn" aria-label="Views">☰</button>
    <span class="mark">board</span>
    <div class="omni">
      <input id="omni" placeholder="Capture a task, or search… try #call" autocomplete="off" />
      <kbd>⌘K</kbd>
      <div class="omnidrop" id="omniDrop" hidden></div>
    </div>
    <div class="nav">
      <button id="prevDay" aria-label="Previous day">‹</button>
      <span class="day-label" id="dayLabel">—</span>
      <button id="nextDay" aria-label="Next day">›</button>
      <button id="todayBtn">today</button>
    </div>
    <div class="hdr-right">
      <span class="dot" id="dot"></span>
      <span class="status-txt" id="statusTxt">—</span>
      <button class="ghost" id="refreshBtn" title="Save and reload">↻</button>
      <button class="ghost" id="gearBtn" aria-label="Settings">⚙</button>
    </div>
  </header>

  <div class="shell">
    <div id="sideScrim"></div>
    <nav class="side" id="side" aria-label="Views">
      <button class="navitem" data-nav="today"><span>Today</span><span class="n"></span></button>
      <button class="navitem" data-nav="inbox"><span>Inbox</span><span class="n"></span></button>
      <button class="navitem" data-nav="priorities"><span>Priorities</span><span class="n"></span></button>
      <button class="navitem" data-nav="projects"><span>Projects</span><span class="n"></span></button>
      <button class="navitem" data-nav="future"><span>Future days</span><span class="n"></span></button>
      <button class="navitem" data-nav="stalled"><span>Stalled</span><span class="n"></span></button>
      <button class="navitem" data-nav="aar"><span>Review</span><span class="n"></span></button>
      <div class="side-sec">tags</div>
      <div id="tagNav"></div>
      <div class="side-sec">lists <button class="pinadd" id="pinAddBtn" title="Pin a new list">+</button></div>
      <div id="listNav"></div>
      <div class="side-foot" id="sideFoot">—</div>
    </nav>
    <main class="main" id="main"></main>
    <aside class="rail" id="rail" aria-label="Context">
      <div id="railInner"></div>
    </aside>
  </div>

  <div class="savebar" id="savebar" hidden>
    <span id="unsavedTxt">0 unsaved</span>
    <button class="ghost" id="discardBtn">discard</button>
    <button class="ghost save" id="batchBtn">save</button>
  </div>

  <div class="mvscrim" id="mvScrim"></div>
  <div class="mv" id="mvSheet" role="dialog" aria-label="Move task"></div>

  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet" role="dialog" aria-label="Settings">
    <h2>Connection</h2>
    <p style="margin:0;font-size:.76rem;color:var(--faint)">Shared with the capture app on this origin.</p>
    <label for="cfgUrl">Backend URL</label>
    <input id="cfgUrl" inputmode="url" placeholder="https://your-service-xxxx.run.app" />
    <label for="cfgToken">Capture token</label>
    <input id="cfgToken" type="password" placeholder="the shared secret your backend expects" />
    <div class="rowb"><button class="save" id="saveBtn">Save</button></div>
  </div>
  <div class="sheet" id="dateSheet" role="dialog" aria-label="Pick a date">
    <h2 id="dateTitle">Schedule for…</h2>
    <div class="datelist" id="dateList"></div>
    <label for="dateInput">Or a specific date</label>
    <input id="dateInput" type="date" />
    <div class="rowb"><button class="save" id="dateSave">Schedule</button></div>
  </div>
  <div class="scrim" id="cvScrim"></div>
  <div class="sheet" id="cvSheet" role="dialog" aria-label="Convert to project">
    <h2>Convert to project</h2>
    <label for="cvName">Project name</label>
    <input id="cvName" placeholder="what is this project called?" />
    <div id="cvHomeWrap">
      <label>Where</label>
      <div class="rowb" style="margin-top:.35rem">
        <button class="ghost mini on" id="cvHomeActive">Active</button>
        <button class="ghost mini" id="cvHomeStalled">Stalled</button>
      </div>
    </div>
    <p id="cvHint" style="margin:.7rem 0 0;font-size:.68rem;color:var(--faint);line-height:1.45"></p>
    <div class="rowb"><button class="save" id="cvGo">Convert</button></div>
  </div>

  <div class="toast" id="toast" role="status"></div>

<script>
(function(){
  "use strict";

  // ── config ─────────────────────────────
  // Shared with the capture app: same origin, same localStorage, so the
  // token is entered once. Writing back the whole object keeps any key the
  // capture app owns (pins, queue targets) intact.
  const LS = {
    get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
    set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
  };
  const $ = id => document.getElementById(id);
  let cfg = LS.get("inbox.cfg", { url:"", token:"" });

  let data = null;           // the last /board payload
  let dirty = false;         // moved since the last load — ↻ to resync
  let fetchedAt = 0;         // when, for the staleness guard
  let ctxCache = {};         // weather by date — it does not move in minutes
  const STALE_MS = 90000;
  const CTX_STALE_MS = 900000;
  let viewDate = null;       // YYYY-MM-DD being planned
  let routeView = false;     // shade by where /defer would send each task
  let busy = false;          // one write in flight at a time
  let nav = "today";         // which center view the sidebar points at
  let listNav = null;        // pinned-note path when nav === "list"
  const collapsed = new Set(LS.get("board.collapsed", []));
  // Tags: plain inline #tokens in a fixed vocabulary; they stay in the task
  // text (the backend strips them only for identity), so a rename keeps them.
  const TAGS = ["urgent","home","phone","call"];
  const TAG_RE = /(^|\s)#(urgent|home|phone|call)\b/gi;
  const tagsOf = s => { const o=[]; let m; TAG_RE.lastIndex=0;
    while((m=TAG_RE.exec(s||""))){ const t=m[2].toLowerCase(); if(!o.includes(t)) o.push(t); }
    return o; };
  const stripTags = s => (s||"").replace(TAG_RE," ").replace(/\s+/g," ").trim();
  let tagFilter = "";
  // Projects view filter: all / active / stalled. Persisted because the
  // stalled group is where you go to review parked work, and reopening the
  // board should not silently show every active project again.
  let projFilter = (()=>{
    const v = LS.get("board.projFilter", "all");
    return ["all","active","stalled"].includes(v) ? v : "all";
  })();
  let cvCtx = null;          // {text, from, row} for the convert sheet
  let cvHome = "priorities"; // where a converted task becomes a project

  // ── api ────────────────────────────────
  function rawFetch(path, opts){
    return fetch(cfg.url.replace(/\/+$/,"")+path, Object.assign({
      headers:{ "Content-Type":"application/json", "Authorization":"Bearer "+(cfg.token||"") }
    }, opts||{}));
  }
  // Board edits (/move, /check) are NOT sent one by one: they queue here and
  // go out together when you press Save (POST /batch) — one commit per note
  // instead of one per action. The caller gets an instant synthetic "ok", so
  // every existing code path (move, tick, rename, delete, undo) is unchanged.
  const BATCHED = new Set(["/move","/check"]);
  let queue = [];
  function api(path, opts){
    const o = opts || {};
    if(o.method==="POST" && BATCHED.has(path)){
      const body = JSON.parse(o.body || "{}");
      queue.push({path:path, body:body});
      updateBatchUI();
      const out = path==="/move"
        ? { ok:true, project:(body.to && body.to.project) || (body.from && body.from.project) || undefined }
        : (data && data.day ? data.day : {});
      return Promise.resolve(new Response(JSON.stringify(out), {status:200}));
    }
    return rawFetch(path, o);
  }
  function updateBatchUI(){
    const bar = $("savebar"); if(!bar) return;
    bar.hidden = !queue.length;
    $("unsavedTxt").textContent = queue.length+" unsaved change"+(queue.length===1?"":"s");
    if(queue.length) setConn("online", queue.length+" unsaved");
  }
  // true = saved (or nothing to save), false = server rejected the batch
  // (nothing was written; queue dropped so the board can reload), null =
  // couldn't reach the server (queue kept — your changes are still here).
  async function flush(){
    if(!queue.length) return true;
    const ops = queue.slice();
    setConn(null, "saving…");
    try{
      const r = await rawFetch("/batch", {method:"POST", body:JSON.stringify({ops:ops})});
      const j = await r.json().catch(()=>({}));
      if(!r.ok){
        queue = []; updateBatchUI();
        toastBad("couldn't save ("+(j.error||r.status)+(j.index!=null?", change "+(j.index+1):"")+") — nothing was written, reloading");
        return false;
      }
      queue = []; updateBatchUI();
      setConn("online", j.commits ? "saved · "+j.commits+" commit"+(j.commits>1?"s":"") : "saved");
      return true;
    }catch(e){
      setConn("offline", "not saved");
      toastBad("couldn't reach the server — your changes are still here");
      return null;
    }
  }
  function discard(){
    if(!queue.length) return;
    queue = []; updateBatchUI();
    toast("changes discarded");
    refresh();
  }
  addEventListener("beforeunload", e=>{ if(queue.length){ e.preventDefault(); e.returnValue=""; } });
  function setConn(state, note){
    $("dot").className = "dot"+(state?" "+state:"");
    $("statusTxt").textContent = note || (queue.length ? queue.length+" unsaved"
      : state==="online"?"synced":state==="offline"?"offline":"—");
    updateFoot();
  }

  // ── dates ──────────────────────────────
  const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  function parseD(s){ const p=(s||"").split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
  function isoD(d){
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
  function fmtD(s){ const d=parseD(s); return DOW[d.getDay()]+" "+d.getDate()+" "+MON[d.getMonth()]; }
  function shiftD(s, n){ const d=parseD(s); d.setDate(d.getDate()+n); return isoD(d); }
  function relD(s){
    if(!data) return "";
    const a=parseD(s), b=parseD(data.today);
    const n=Math.round((a-b)/86400000);
    return n===0?"today":n===1?"tomorrow":n===-1?"yesterday":n>0?"in "+n+"d":Math.abs(n)+"d ago";
  }
  function fmtMin(m){
    const h=Math.floor(m/60), r=m%60;
    return h&&r? h+"h"+r+"m" : h? h+"h" : r+"m";
  }

  // ── small dom helpers ──────────────────
  function el(tag, cls, txt){
    const e=document.createElement(tag);
    if(cls) e.className=cls;
    if(txt!=null) e.textContent=txt;
    return e;
  }
  const CHECK='<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';

  // Where /defer sends an unfinished task, by the `###` section it sits in.
  // Shown on demand so "what happens if I don't do this" is visible while
  // you plan rather than discovered the next morning.
  const ROUTE_LABEL = { daily:"stays", recurring:"stays", project:"→ project",
                        today:"→ future", misc:"→ future" };

  /** One task line. `addr` is the pane address it currently lives at, so
   *  its actions can name the source without re-deriving it from the view. */
  function row(item, addr, opts){
    opts = opts||{};
    const r = el("div","row"+(item.checked?" done":"")+(opts.plain?" plain":""));
    r.dataset.text = item.raw || item.text;
    r.dataset.addr = JSON.stringify(addr);
    r.dataset.min = String(item.hint || 20);
    if(item.project) r.dataset.project = item.project;
    const cb = el("span","cb"); cb.innerHTML = CHECK;
    // Wired on every row, not just the ones that start in the day: a row
    // moved into today is not re-rendered any more, so its handler has
    // to read the address it has NOW rather than the one it was born with.
    cb.addEventListener("click", e=>{
      e.stopPropagation();
      let a = addr;
      try{ a = JSON.parse(r.dataset.addr); }catch(err){}
      if(a.pane !== "day"){ toast("ticking works once it is on a day"); return; }
      tick(r, item, a);
    });
    const tg = tagsOf(item.text);
    const tx = el("span","tx", stripTags(item.text));
    r.dataset.tags = tg.join(" ");
    tg.forEach(t=>{ tx.append(el("span","badge tg t-"+t, "#"+t)); });
    if(item.hint) tx.append(el("span","badge", "~"+fmtMin(item.hint)));
    const proj = item.project || (addr && addr.project) || null;
    if(proj) r.dataset.project = proj;
    if(proj && !opts.noProj){
      const p = el("span","badge proj", proj.replace(/[\[\]]/g,""));
      tx.append(p);
    }
    if(routeView && opts.route && ROUTE_LABEL[opts.route])
      tx.append(el("span","badge route", ROUTE_LABEL[opts.route]));
    if(opts.src) tx.append(el("span","badge src", opts.src));
    const acts = el("div","rowacts");
    const ed = el("button",null,"✎"); ed.title="Edit"; ed.addEventListener("click", ()=>edit(r, tx, item, addr));
    acts.append(ed);
    // Review is long-term storage, not a worklist: a saved restaurant has
    // no schedule and no move action, only rename/remove.
    if(!opts.storage){
      const sc = el("button",null,"◷"); sc.title="Schedule for a date";
      sc.addEventListener("click", ()=>pickDate(t=>{
        const a = JSON.parse(r.dataset.addr);
        move(r.dataset.text, a, {pane:"future", date:t}, r.dataset.project,
             null, null, r).then(ok=>{ if(ok) r.remove(); });
      }));
      acts.append(sc);
      if(!item.checked){
        const mv = el("button","mvb","⇢"); mv.title = "Move, schedule, edit…";
        mv.addEventListener("click", e=>{ e.stopPropagation(); openMove(r, item); });
        acts.prepend(mv);
      }
    }
    // A completed line in the month file is the record, not a worklist
    // item — there is nothing to remove, so no × on it.
    if(!item.checked){
      const rm = el("button","x","×");
      rm.title = opts.storage ? "Remove from storage" : "Delete";
      rm.addEventListener("click", ()=>del(r.dataset.text,
        JSON.parse(r.dataset.addr), r.dataset.project, r));
      acts.append(rm);
    }
    r.append(cb, tx, acts);
    // Backspace removes the focused row, so a pass through the inbox does
    // not mean aiming at a small × twenty times. Only the row itself
    // (never its text, which may be mid-edit) counts as a target.
    r.tabIndex = 0;
    r.addEventListener("keydown", e=>{
      if(e.target !== r) return;
      if(e.key!=="Backspace" && e.key!=="Delete") return;
      if(item.checked) return;
      e.preventDefault();
      del(r.dataset.text, JSON.parse(r.dataset.addr), r.dataset.project, r);
    });
    return r;
  }

  /** A checkable row of a pinned list. Lists are not /move panes, so this
   *  is deliberately simpler than a task row: no move actions — just the
   *  toggle, which writes through /pin/toggle. */
  function listRow(item, path){
    const r = el("div","row static"+(item.checked?" done":"")+(item.box?"":" plain"));
    const cb = el("span","cb"); cb.innerHTML = CHECK;
    cb.addEventListener("click", async e=>{
      e.stopPropagation();
      const want = !item.checked;
      r.classList.add("pending"); r.classList.toggle("done", want);
      try{
        const res = await rawFetch("/pin/toggle", {method:"POST",
          body:JSON.stringify({path:path, text:item.raw||item.text, checked:want})});
        if(!res.ok) throw new Error("HTTP "+res.status);
        item.checked = want;
        r.classList.remove("pending");
        setConn("online");
        renderSide(); renderRail();
      }catch(err){
        r.classList.toggle("done", item.checked);
        r.classList.remove("pending");
        toastBad("couldn't update");
      }
    });
    const tx = el("span","tx", item.text);
    r.append(cb, tx);
    return r;
  }

  /** A list of rows. Lanes are grouping only now; the move sheet names
   *  its destination explicitly. */
  function lane(opts){
    opts = opts||{};
    return el("div","lane"+(opts.mini?" mini":""));
  }

  function group(label, cls, count, key){
    const g = el("div","grp"+(cls?" "+cls:""));
    const chev = el("span","chev", collapsed.has(key)?"▸":"▾");
    g.append(chev, el("span",null,label));
    if(count!=null) g.append(el("span","n", String(count)));
    if(key) g.addEventListener("click", ()=>{
      collapsed.has(key)? collapsed.delete(key) : collapsed.add(key);
      LS.set("board.collapsed",[...collapsed]); render();
    });
    return g;
  }

  // ── counts (sidebar numbers, computed from DATA, not the DOM — only one
  // view is on screen at a time, so the DOM can't be the source) ──
  function openIn(ns){
    let o=0;
    (function w(x){ for(const n of x||[]){ if(n.box && !n.checked) o++; w(n.children); } })(ns);
    return o;
  }
  function navCounts(){
    return {
      today: data.day.exists ? openIn(data.day.tasks) : 0,
      inbox: (data.inbox||[]).length,
      priorities: (data.priorities.projects||[]).reduce((a,p)=>a+p.tasks.length,0)
                  + (data.priorities.tasks||[]).length,
      // Projects view shows every project, regardless of whether it has a
      // next action yet, so the number counts them all too.
      projects: (data.priorities.projects||[]).length
                + ((data.stalled&&data.stalled.projects)||[]).length,
      future: (data.future||[]).reduce((a,d)=>a+d.tasks.length,0),
      // Stalled is a loose-task list now; its projects live in Projects.
      stalled: ((data.stalled&&data.stalled.items)||[]).length,
      aar: (data.aar.categories||[]).reduce((a,c)=>a+c.items.length,0),
    };
  }
  // Normalized text of every task already on today's plan (open OR done).
  // /daily deliberately leaves Top Priorities' `Tasks:` lines in place, so
  // those land on the day AND stay in the priorities note. Without this set
  // the waiting card counts and lists them a second time.
  function todayKeys(){
    const s = new Set();
    (function w(ns){ for(const n of ns||[]){
      if(n.box) s.add(norm(n.text));
      w(n.children);
    } })(data.day.tasks||[]);
    return s;
  }
  // the "waiting" number: everything unplanned that today could still pull from
  function waitingCount(){
    const keys = todayKeys();
    let n = 0;
    for(const t of data.inbox||[]) if(!keys.has(norm(t.text))) n++;
    for(const p of data.priorities.projects||[])
      for(const t of p.tasks||[]) if(!keys.has(norm(t.text))) n++;
    for(const t of data.priorities.tasks||[]) if(!keys.has(norm(t.text))) n++;
    for(const d of data.future||[])
      for(const t of d.tasks||[]) if(!keys.has(norm(t.text))) n++;
    return n;
  }
  function tagCounts(){
    const c={}; TAGS.forEach(t=>c[t]=0);
    const bump=s=>{ for(const t of tagsOf(s||"")) if(t in c) c[t]++; };
    (function w(ns){ for(const n of ns||[]){ bump(n.text); w(n.children); } })(data.day.tasks||[]);
    for(const t of data.inbox) bump(t.text);
    for(const d of data.future||[]) for(const t of d.tasks) bump(t.text);
    for(const src of ["priorities", "stalled"]){
      for(const p of data[src].projects||[]){ bump(p.display); for(const t of p.tasks) bump(t.text); }
      for(const t of data[src].tasks||[]) bump(t.text);
    }
    // Stalled's loose tasks/ideas all live in `items` now; `ideas` is
    // still present for an old cached shell but would double-count here.
    for(const it of (data.stalled&&data.stalled.items)||[]) bump(it.text);
    return c;
  }

  // ── sidebar ────────────────────────────
  function renderSide(){
    const c = navCounts();
    for(const k of ["today","inbox","priorities","projects","future","stalled","aar"]){
      const n = document.querySelector('.navitem[data-nav="'+k+'"] .n');
      if(n) n.textContent = String(c[k]);
    }
    document.querySelectorAll(".navitem[data-nav]").forEach(b=>
      b.classList.toggle("on", b.dataset.nav===nav && nav!=="list"));
    const tn = $("tagNav"); tn.innerHTML="";
    const tc = tagCounts();
    TAGS.forEach(t=>{
      const b = el("button","navitem t-"+t);
      b.append(el("span","dot2"), el("span",null,"#"+t), el("span","n",String(tc[t]||"")));
      b.classList.toggle("on", tagFilter===t);
      b.addEventListener("click", ()=>{ tagFilter = tagFilter===t?"":t; render(); });
      tn.append(b);
    });
    const ln = $("listNav"); ln.innerHTML="";
    for(const L of (data.lists||[])){
      const b = el("button","navitem");
      b.append(el("span",null,L.title||L.path),
               el("span","n",String(L.items.filter(i=>i.box&&!i.checked).length)));
      b.classList.toggle("on", nav==="list" && listNav===L.path);
      b.addEventListener("click", ()=>go("list", L.path));
      ln.append(b);
    }
    if(!((data.lists||[]).length))
      ln.append(el("div","empty","pin a note to see it here"));
  }
  function go(which, listPath){
    nav = which; if(listPath!=null) listNav = listPath;
    closeDrawer(); render();
  }
  function closeDrawer(){
    $("side").classList.remove("open"); $("sideScrim").classList.remove("open");
  }

  // ── render ─────────────────────────────
  function render(){
    if(!data) return;
    $("dayLabel").innerHTML = "";
    $("dayLabel").append(el("span",null,fmtD(viewDate)), el("span","rel",relD(viewDate)));
    renderSide();
    renderCenter();
    renderRail();
    updateFoot();
  }

  function renderCenter(){
    const host = $("main"); host.innerHTML = "";
    if(nav==="today") renderDay(host);
    else if(nav==="list") renderListView(host);
    else if(nav==="projects") renderProjectsView(host);
    else renderSourceView(host);
    applyDim();
  }

  function applyDim(){
    document.querySelectorAll(".main .row:not(.static)").forEach(r=>
      r.classList.toggle("dim", !!tagFilter && !(r.dataset.tags||"").split(" ").includes(tagFilter)));
  }

  // ── render: the day ────────────────────
  function renderDay(host){
    const card = el("div","card day");

    const head = el("div","dayhead");
    head.append(el("h1",null, viewDate===data.today ? "Today" : fmtD(viewDate)));
    if(viewDate!==data.today) head.append(el("span","daysub",relD(viewDate)));
    if(!data.day.exists && viewDate===data.today){
      const bb = el("button","ghost","build the day"); bb.id="buildBtn";
      bb.addEventListener("click",buildDay);
      head.append(bb);
    }
    const dv = el("button","ghost","defer view"); dv.id="deferBtn";
    dv.classList.toggle("on", routeView);
    dv.title = "Shade each task by where /defer would send it tomorrow";
    dv.addEventListener("click",()=>{ routeView=!routeView; render(); });
    head.append(dv);
    card.append(head);

    // summary: planned counts + progress dots
    let done=0, open=0;
    (function w(ns){ for(const n of ns||[]){
      if(n.box){ n.checked? done++ : open++; } w(n.children); } })(data.day.tasks||[]);
    const sum = el("div","daysum");
    const planned = done+open;
    sum.append(el("span",null, data.day.exists
      ? done+" of "+planned+" done · "+waitingCount()+" waiting"
      : "not built yet"));
    if(data.day.exists && done+open){
      const pr = el("div","prog");
      for(let i=0;i<Math.min(done+open,10);i++) pr.append(el("i", i<done?"f":null));
      sum.append(pr);
    }
    card.append(sum);

    const head2 = el("div","card-head");
    head2.append(el("span",null,"the plan"), el("span","path", data.day.path||""));
    card.append(head2);

    if(!data.day.exists){
      card.append(el("div","empty",
        viewDate===data.today ? "The 8am run builds this, or build it now."
                              : "Nothing planned for this day yet. Add something below, or use ⇢ to move a task here."));
    }

    // one flat lane for the whole day. Blocks went with the block scheduler
    // server-side — the day file's own order is the plan now. Events (all-day
    // AND timed) still show above the lane, because appointments are the
    // fixed frame around it.
    const sections = taskIndex();
    const flat = [];
    (function walk(nodes, project){
      for(const n of nodes||[]){
        if(n.box) flat.push({node:n, project:project});
        walk(n.children, n.box? project : n.text);
      }
    })(data.day.tasks||[], null);

    for(const ev of (data.events||[])){
      const e = el("div","evt");
      e.append(el("span","when", ev.all_day?"all day":(ev.start||"")), el("span",null,ev.title));
      card.append(e);
    }
    const l = lane();
    for(const f of flat)
      l.append(row(nodeItem(f), {pane:"day", date:viewDate},
                   {tickable:true, route:sections[norm(f.node.text)]}));
    card.append(l);
    const add = el("input","adder");
    add.placeholder = viewDate===data.today ? "add to today…" : "add to this day…";
    add.addEventListener("keydown", e=>{
      if(e.key!=="Enter" || !add.value.trim()) return;
      const v = add.value.trim(); add.value="";
      move(v, {pane:"inbox"}, {pane:"day", date:viewDate});
    });
    card.append(add);

    // finished work folds away; a click reopens it
    if(done){
      const dk = "done:"+viewDate;
      const isOpen = collapsed.has(dk);
      const g = el("div","grp");
      g.append(el("span","chev", isOpen?"▾":"▸"), el("span",null,"done today"), el("span","n",String(done)));
      g.addEventListener("click", ()=>{
        collapsed.has(dk)? collapsed.delete(dk) : collapsed.add(dk);
        LS.set("board.collapsed",[...collapsed]); render();
      });
      card.append(g);
      if(isOpen){
        const l = lane();
        for(const f of flat) if(f.node.checked)
          l.append(row(nodeItem(f), {pane:"day", date:viewDate}, {}));
        card.append(l);
      }
    }

    host.append(card);

    // what is waiting to be planned: the backlog above
    if(viewDate===data.today) host.append(renderWaiting());
  }

  function renderWaiting(){
    const card = el("div","card");
    const wh = el("div","card-head");
    wh.append(el("span",null,"waiting"), el("span","n",String(waitingCount())));
    card.append(wh);
    if((data.missing||[]).length)
      card.append(el("div","warnbar",
        "not found in the vault: "+data.missing.join(", ")+" — set its path in the service env"));
    for(const d of collisions())
      card.append(el("div","warnbar",
        "“"+d.text+"” is live in both "+d.a+" and "+d.b
        +" — they are one task to /check, so ticking one may flip the other"));

    const keys = todayKeys();

    // priorities: projects first, then loose tasks — skip anything already on today
    const prioRows = [];
    for(const p of data.priorities.projects||[])
      for(const t of p.tasks||[])
        if(!keys.has(norm(t.text)))
          prioRows.push({t, p});
    const loosePrio = (data.priorities.tasks||[]).filter(t=>!keys.has(norm(t.text)));
    const pc = prioRows.length + loosePrio.length;
    const pk = "w:priorities";
    card.append(group("priorities", null, pc, pk));
    const pl = lane({mini:true});
    if(!collapsed.has(pk)){
      for(const {t,p} of prioRows)
        pl.append(row(Object.assign({}, t, {project:p.body}),
                      {pane:"priorities", project:p.body}, {src:"priorities"}));
      for(const t of loosePrio)
        pl.append(row(t, {pane:"priorities"}, {src:"priorities"}));
    }
    card.append(pl);

    // future days: dated groups, flattened into one lane per date — skip already on today
    const filteredFuture = (data.future||[]).map(d=>({
      ...d, tasks:(d.tasks||[]).filter(t=>!keys.has(norm(t.text)))
    }));
    const fc = filteredFuture.reduce((a,d)=>a+d.tasks.length,0);
    const fk = "w:future";
    card.append(group("future days", null, fc, fk));
    if(!collapsed.has(fk))
      for(const d of filteredFuture){
        if(!d.tasks.length) continue;
        const l = lane({mini:true});
        for(const t of d.tasks)
          l.append(row(t, {pane:"future", date:d.date, project:t.project},
                      {src:"future · "+fmtD(d.date)}));
        card.append(l);
      }

    // inbox — skip anything already on today
    const filteredInbox = (data.inbox||[]).filter(t=>!keys.has(norm(t.text)));
    const ik = "w:inbox";
    card.append(group("inbox", null, filteredInbox.length, ik));
    const il = lane({mini:true});
    if(!collapsed.has(ik))
      for(const t of filteredInbox)
        il.append(row(t, {pane:"inbox"}, {src:"inbox"}));
    if(!filteredInbox.length) il.append(el("div","empty","clear"));
    card.append(il);

    const totalSource = (data.inbox||[]).length
      + (data.priorities.projects||[]).reduce((a,p)=>a+(p.tasks||[]).length,0)
      + (data.priorities.tasks||[]).length
      + (data.future||[]).reduce((a,d)=>a+(d.tasks||[]).length,0);
    const onToday = totalSource - waitingCount();
    if(onToday)
      card.append(el("div","sub", onToday+" already on today’s plan"));
    return card;
  }

  // ── render: the stalled scratchpad ─────
  // The note is a MIXED list: projects are explicit `[[wikilinks]]` and live
  // in the Projects view; everything else is loose work shown here, grouped
  // by the note's own headings. This is deliberately not a project card —
  // the old view made every top-level checkbox look like a project.
  function renderStalledView(host){
    const d = data.stalled || {};
    const items = d.items || [];
    const projects = d.projects || [];
    const card = el("div","card day");
    const head = el("div","dayhead");
    head.append(el("h1",null,"Stalled"));
    head.append(el("span","path",(d.path||"").split("/").pop()));
    card.append(head);

    const intro = el("div","intro");
    intro.append("Loose work from the stalled scratchpad. ",
      "Projects in this note are ",
      el("code",null,"[[wikilinks]]"), " and live in the Projects view.");
    card.append(intro);
    if(projects.length){
      const toProj = el("button","ghost mini",
        projects.length+(projects.length===1?" stalled project":" stalled projects")+" →");
      toProj.title = "Show the stalled projects";
      toProj.addEventListener("click", ()=>{
        projFilter = "stalled"; LS.set("board.projFilter", projFilter);
        go("projects");
      });
      card.append(toProj);
    }

    if(!items.length)
      card.append(el("div","empty","nothing loose here — projects are in Projects"));

    const bySection = new Map();
    for(const it of items){
      const s = it.section || "stalled";
      if(!bySection.has(s)) bySection.set(s, []);
      bySection.get(s).push(it);
    }
    for(const [section, list] of bySection){
      const sk = "st:"+section;
      card.append(group(section, null, list.length, sk));
      if(collapsed.has(sk)) continue;
      const l = lane({mini:true});
      for(const it of list){
        const addr = {pane:"stalled", section:it.section||null,
                      plain:!it.box};
        const opts = {plain:!it.box};
        if(it.children)
          opts.src = it.children+(it.children===1?" sub-item":" sub-items");
        l.append(row(it, addr, opts));
      }
      card.append(l);
    }

    const add = el("input","adder");
    add.placeholder = "add a stalled task…";
    add.addEventListener("keydown", e=>{
      if(e.key!=="Enter" || !add.value.trim()) return;
      const v = add.value.trim(); add.value="";
      move(v, {pane:"inbox"}, {pane:"stalled"});
    });
    card.append(add);
    host.append(card);
  }

  // ── render: projects ───────────────────
  // One first-class space for both `Top Projects` (active) and the stalled
  // list. The project bullet and its first open subtask are the unit —
  // counts and future commitments are read live from the same /board payload,
  // never cached separately.
  function sameProj(a, b){
    const ka = String(a||"").replace(/[\[\]]/g,"").trim().toLowerCase();
    const kb = String(b||"").replace(/[\[\]]/g,"").trim().toLowerCase();
    if(!ka || !kb) return false;
    if(ka===kb) return true;
    // Same minimum-length rule as board._same_project: a one-letter name
    // must not match every project that contains that letter.
    const short = ka.length<=kb.length ? ka : kb;
    const long_ = ka.length<=kb.length ? kb : ka;
    return short.length>=3 && long_.includes(short);
  }
  function projectFuture(body){
    const out = [];
    for(const d of data.future||[])
      for(const t of d.tasks||[])
        if(t.project && sameProj(t.project, body))
          out.push({date:d.date, text:t.text});
    return out;
  }
  function addProjectLine(card, stalled){
    const add = el("input","adder");
    add.placeholder = stalled ? "add a stalled project…" : "new project name…";
    add.addEventListener("keydown", async e=>{
      if(e.key!=="Enter" || !add.value.trim()) return;
      const v = add.value.trim(); add.value="";
      try{
        const r = await rawFetch(stalled ? "/stalled/projects/add" : "/projects/add", {method:"POST",
          body:JSON.stringify({name:v})});
        const j = await r.json().catch(()=>({}));
        if(!r.ok) throw new Error(j.error||("HTTP "+r.status));
        toast(j.changed ? "project added" : "already there");
        setConn("online"); refresh();
      }catch(err){ toastBad("couldn't add project — "+err.message); }
    });
    card.append(add);
  }
  function renderProjectsView(host){
    const card = el("div","card day");
    const head = el("div","dayhead");
    head.append(el("h1",null,"Projects"));
    card.append(head);
    const pi = el("div","intro");
    pi.append("Active projects are the ",
      el("code",null,"Top Projects"), " bullets; stalled ones come from the ",
      "stalled list. The first unchecked subtask is the next action, and ",
      "dated work parked in Future Days is counted against its project.");
    card.append(pi);
    card.append(el("div","sub","add a project to Top Priorities"));
    addProjectLine(card);
    card.append(el("div","sub","or park a stalled project"));
    addProjectLine(card, true);

    const fbar = el("div","projfilter");
    for(const [k,label] of [["all","All"],["active","Active"],["stalled","Stalled"]]){
      const b = el("button","ghost mini"+(projFilter===k?" on":""), label);
      b.addEventListener("click", ()=>{
        projFilter = k; LS.set("board.projFilter", k); render();
      });
      fbar.append(b);
    }
    card.append(fbar);

    const groups = [
      ["active", "priorities", (data.priorities&&data.priorities.projects)||[]],
      ["stalled", "stalled", (data.stalled&&data.stalled.projects)||[]],
    ].filter(([kind])=>projFilter==="all" || projFilter===kind);
    let total = 0;
    for(const [kind, pane, projs] of groups){
      if(!projs.length) continue;
      const gk = "pv:"+kind;
      card.append(group(kind+" projects", null, projs.length, gk));
      if(collapsed.has(gk)) continue;
      // Keep the stalled note's headings as sections inside each kind.
      const bySection = new Map();
      for(const p of projs){
        const s = p.section || kind;
        if(!bySection.has(s)) bySection.set(s, []);
        bySection.get(s).push(p);
      }
      for(const [section, list] of bySection){
        const sk = gk+":"+section;
        if(projs.some(p=>p.section)){
          card.append(group(section, null, list.length, sk));
          if(collapsed.has(sk)) continue;
        }
        for(const p of list){
          total++;
          const fut = projectFuture(p.body);
          const pc = el("div","projcard");
          const ph = el("div","projhead");
          ph.append(el("span","name", p.display),
                    el("span","pill "+kind, kind));
          ph.append(el("span","n", p.tasks.length+" next"));
          if(fut.length) ph.append(el("span","pill future", fut.length+" future"));
          ph.append(projectMoveBtn(p, pane));
          ph.append(projectDeleteBtn(p, pane));
          pc.append(ph);
          const meta = [];
          meta.push(p.tasks.length ? "next: "+p.tasks[0].text
                                   : "no next action — add one or move a task here");
          if(fut.length)
            meta.push("future: "+fut.map(f=>fmtD(f.date)).join(", "));
          pc.append(el("div","projmeta", meta.join(" · ")));
          const l = lane({mini:true});
          for(const t of p.tasks)
            l.append(row(t, {pane:pane, project:p.body}, {noProj:true}));
          if(!p.tasks.length) l.append(el("div","empty","move a task here"));
          pc.append(l);
          const add = el("input","adder");
          add.placeholder = "next action for "+p.display+"…";
          add.addEventListener("keydown", async e=>{
            if(e.key!=="Enter" || !add.value.trim()) return;
            const v = add.value.trim(); add.value="";
            try{
              const r = await rawFetch("/project/task", {method:"POST",
                body:JSON.stringify({project:p.body, text:v})});
              const j = await r.json().catch(()=>({}));
              if(!r.ok) throw new Error(j.error||("HTTP "+r.status));
              toast(j.changed ? "next action added" : "already there");
              setConn("online"); refresh();
            }catch(err){ toastBad("couldn't add — "+err.message); }
          });
          pc.append(add);
          card.append(pc);
        }
      }
    }
    if(!total) card.append(el("div","empty",
      projFilter==="all" ? "no projects yet — add one above"
                         : "no "+projFilter+" projects"));
    host.append(card);
  }

  /** Move a whole project (bullet + its next actions) between the two
   *  project homes. Not batched: it read-modify-writes both notes. */
  function projectMoveBtn(p, pane){
    const to = pane==="stalled" ? "priorities" : "stalled";
    const b = el("button","ghost mini", to==="priorities" ? "→ priorities" : "→ stalled");
    b.title = "Move this project and its next actions to "
              +(to==="priorities" ? "Top Priorities" : "the stalled list");
    b.addEventListener("click", async e=>{
      e.stopPropagation();
      try{
        const r = await rawFetch("/project/move", {method:"POST",
          body:JSON.stringify({name:p.body, from:pane, to:to})});
        const j = await r.json().catch(()=>({}));
        if(!r.ok) throw new Error(j.error||("HTTP "+r.status));
        toast("project moved to "+to);
        setConn("online"); refresh();
      }catch(err){ toastBad("couldn't move project — "+err.message); }
    });
    return b;
  }

  function projectDeleteBtn(p, pane){
    const b = el("button","ghost mini","×");
    b.title = "Delete this project (and its next actions)";
    let armed = false, timer = null;
    const label = p.tasks.length
      ? "delete "+p.tasks.length+" next action"+(p.tasks.length===1?"":"s")
      : "delete?";
    b.addEventListener("click", async e=>{
      e.stopPropagation();
      if(!armed){
        armed = true; b.textContent = label; b.classList.add("on");
        timer = setTimeout(()=>{ armed=false; b.textContent="×"; b.classList.remove("on"); }, 4000);
        return;
      }
      clearTimeout(timer); armed = false;
      b.disabled = true; b.textContent = "deleting…";
      try{
        const r = await rawFetch("/project/remove", {method:"POST",
          body:JSON.stringify({name:p.body, from:pane, force:true})});
        const j = await r.json().catch(()=>({}));
        if(!r.ok) throw new Error(j.error||("HTTP "+r.status));
        setConn("online");
        // undo restores the captured block verbatim
        offerUndoProject(p.body, pane, j.block);
        toast("project deleted");
        refresh();
      }catch(err){ toastBad("couldn't delete project — "+err.message); }
      finally{ b.disabled=false; b.textContent="×"; b.classList.remove("on"); }
    });
    return b;
  }

  function offerUndoProject(name, pane, block){
    const t=$("toast"); t.className="toast show"; t.innerHTML="";
    t.append(el("span",null,"deleted project"));
    const b=el("button","undo","undo");
    b.addEventListener("click", async ()=>{
      t.classList.remove("show");
      try{
        const r = await rawFetch("/project/restore", {method:"POST",
          body:JSON.stringify({name, from:pane, block})});
        if(!r.ok) throw new Error("HTTP "+r.status);
        setConn("online"); refresh();
      }catch(err){ toastBad("couldn't restore — "+err.message); }
    });
    t.append(b);
    clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"), 6000);
  }

  function projectCard(title, pane, d){
    const card = el("div","card");
    const h = el("div","card-head");
    h.append(el("span",null,title));
    h.append(el("span","path",(d.path||"").split("/").pop()));
    card.append(h);
    // Stalled notes are organised by headings, not labels. Group by the
    // nearest heading so "Need to Start Right away" stays intact.
    const bySection = new Map();
    for(const p of d.projects||[]){
      const s = p.section || "projects";
      if(!bySection.has(s)) bySection.set(s, []);
      bySection.get(s).push(p);
    }
    for(const [section, projs] of bySection){
      const sk = pane+":"+section;
      card.append(group(section, null, projs.length, sk));
      if(collapsed.has(sk)) continue;
      for(const p of projs){
        const key = pane+":"+p.body;
        const g = group(p.display, null, p.tasks.length, key);
        g.append(projectMoveBtn(p, pane));
        card.append(g);
        const l = lane({mini:true});
        if(!collapsed.has(key)){
          for(const t of p.tasks) l.append(row(t, {pane:pane, project:p.body}, {noProj:true}));
          if(!p.tasks.length) l.append(el("div","empty","no next action — move one here"));
        }
        card.append(l);
      }
    }
    if(!(d.projects||[]).length)
      card.append(el("div","empty",
        pane==="stalled" ? "nothing parsed — top-level `- [ ]` or `[[wikilink]]` bullets are projects"
                         : "no projects yet"));
    if(d.tasks && d.tasks.length!==undefined){
      card.append(el("div","sub","tasks"));
      const l = lane({mini:true});
      for(const t of d.tasks) l.append(row(t, {pane:pane}, {}));
      card.append(l);
    }
    if((d.ideas||[]).length){
      const secs = new Map();
      for(const it of d.ideas){
        const s = it.section || "ideas";
        if(!secs.has(s)) secs.set(s, []);
        secs.get(s).push(it);
      }
      for(const [section, items] of secs){
        const key = pane+":ideas:"+section;
        card.append(group(section, null, items.length, key));
        if(collapsed.has(key)) continue;
        const l = lane({mini:true});
        for(const t of items) l.append(row(t, {pane:pane, ideas:true}, {plain:true}));
        card.append(l);
      }
    }
    return card;
  }

  function nodeItem(f){
    return {text:f.node.text, hint:f.node.hint, checked:f.node.checked,
            project:f.project, raw:f.node.text};

  function upcoming(){
    const out = (data.future||[]).filter(d=>d.tasks.length || d.date>=data.today);
    const have = new Set(out.map(d=>d.date));
    // always show the next few days, even when empty
    for(let i=0;i<5;i++){
      const dt = shiftD(data.today, i);
      if(!have.has(dt)) out.push({date:dt, overdue:false, tasks:[]});
    }
    out.sort((a,b)=>a.date<b.date?-1:1);
    // No slice: a task parked six months out is still a commitment, and the
    // board is where you go to see (and reprioritize) the whole horizon.
    return out;
  }

  // Two open tasks that normalize to the same key are one task as far as
  // /check and /move are concerned, so ticking one may flip the other.
  function collisions(){
    const seen = new Map(), out = [];
    const add = (t, where)=>{
      const k = norm(t);
      if(!k) return;
      if(seen.has(k)){
        const first = seen.get(k);
        if(!out.some(x=>x.key===k)) out.push({key:k, text:t, a:first, b:where});
      } else seen.set(k, where);
    };
    (function walk(ns){
      for(const n of ns||[]){ if(n.box && !n.checked) add(n.text, "today"); walk(n.children); }
    })(data.day.tasks||[]);
    for(const t of data.inbox) add(t.text, "the inbox");
    for(const d of data.future||[]) for(const t of d.tasks) add(t.text, "future days");
    for(const src of [["top priorities",data.priorities],["the stalled list",data.stalled]])
      for(const p of src[1].projects||[]) for(const t of p.tasks) add(t.text, src[0]);
    for(const it of (data.stalled&&data.stalled.items)||[])
      add(it.text, "the stalled list");
    return out;
  }

  function sameDest(a, b){
    if(!a || !b || a.pane !== b.pane) return false;
    if(a.pane==="day" || a.pane==="future") return (a.date||"") === (b.date||"");
    if(a.pane==="priorities" || a.pane==="stalled")
      return a.project ? sameProj(a.project, b.project) : !b.project;
    if(a.pane==="aar")
      return (a.category||"") === (b.category||"");
    return true;
  }

  function norm(s){
    return (s||"").replace(/^\s*[-*]\s+(\[[ xX]\]\s+)?/,"")
      .replace(/(^|\s)#(?:urgent|home|phone|call)\b/gi," ")
      .replace(/\s*\|\s*[^|]*$/,"").replace(/[\[\]]/g,"")
      .replace(/\s+/g," ").trim().toLowerCase();
  }

  // ── mutations ──────────────────────────
  async function move(text, from, to, project, position, newText, el2){
    if(busy){ toast("one at a time — still saving"); return refresh(); }
    if(!cfg.url){ openSheet(); return; }
    busy = true; setConn(null, "saving…");
    const body = { text, from:from, to:to, position:position };
    if(newText) body.new_text = newText;
    if(project && !to.project) body.from = Object.assign({}, from, {project:from.project||project});
    try{
      const r = await api("/move", {method:"POST", body:JSON.stringify(body)});
      const j = await r.json().catch(()=>({}));
      if(!r.ok){
        if(j.duplicate){
          toastBad("saved to the destination, but the original is still in place");
        } else throw new Error(j.error||("HTTP "+r.status));
      } else {
        if(el2 && to.pane==="delete") el2.remove();
        else if(el2) applyMoved(el2, to, j.project);
        markDirty();
        offerUndo(text, from, to, j.project);
        updateBatchUI();
        return true;
      }
      setConn("online");
      return false;
    }catch(err){
      toastBad("couldn't move — "+err.message);
      setConn("offline");
      await refresh();
      return false;
    }finally{
      busy = false;
    }
  }

  function applyMoved(node, to, project){

  async function tick(r, item, addr){
    if(busy) return;
    busy = true;
    const want = !item.checked;
    r.classList.add("pending"); r.classList.toggle("done", want);
    try{
      const res = await api("/check",{method:"POST",
        body:JSON.stringify({date:viewDate, text:item.text, checked:want})});
      if(res.status===404){
        toast("changed in the vault — refreshing");
        busy=false; r.classList.remove("pending"); return refresh();
      }
      if(!res.ok) throw new Error("HTTP "+res.status);
      data.day = Object.assign(res_day(await res.json()), {sections:data.day.sections});
      item.checked = want;
      setConn("online");
      busy=false; r.classList.remove("pending");
      renderSide();
      return;
    }catch(e){
      r.classList.toggle("done", item.checked);
      toastBad("couldn't update");
      setConn("offline");
      busy=false; r.classList.remove("pending");
      return refresh();
    }
  }

  function edit(r, tx, item, addr){
    const before = item.raw || item.text;
    tx.querySelectorAll(".badge").forEach(b=>b.remove());
    tx.textContent = item.text;
    tx.setAttribute("contenteditable","true");
    tx.focus();
    const sel=getSelection(), rg=document.createRange();
    rg.selectNodeContents(tx); sel.removeAllRanges(); sel.addRange(rg);
    let settled = false;
    const done = async (save)=>{
      if(settled) return;
      settled = true;
      tx.removeAttribute("contenteditable");
      const after = tx.textContent.trim();
      if(!save || !after || after===item.text) return render();
      await move(before, addr, addr, r.dataset.project, null, after);
    };
    // Use onkeydown/onblur (not addEventListener) so repeated edits of the
    // same row don't stack handlers. Stop propagation so keystrokes used to
    // edit text never reach the row's Backspace/Delete shortcut or the
    // document's arrow-key navigation.
    tx.onkeydown = e=>{
      e.stopPropagation();
      if(e.key==="Enter"){ e.preventDefault(); done(true); }
      else if(e.key==="Escape"){ e.preventDefault(); done(false); }
    };
    tx.onblur = ()=>done(true);
  }

    if(to.pane==="priorities") return to.project? "added to "+to.project.replace(/[\[\]]/g,"") : "sent to priorities";

    if(to.pane==="aar") return "saved to review · "+to.category;
    if(to.pane==="delete") return "deleted";

  async function doCapture(text){

  function searchIndex(){
    const out=[];
    const push=(text,where,navTo,list)=>{ if(text) out.push({text,where,navTo,list}); };
    (function w(ns){ for(const n of ns||[]){ if(n.text) push(n.text,"today","today"); w(n.children); } })(data.day.tasks||[]);
    for(const t of data.inbox) push(t.text,"inbox","inbox");
    for(const d of data.future||[]) for(const t of d.tasks) push(t.text,"future · "+fmtD(d.date),"future");
    for(const src of ["priorities","stalled"]){
      for(const p of data[src].projects||[]){
        push(p.display, src, src);
        for(const t of p.tasks) push(t.text, p.display.replace(/[\[\]]/g,""), src);
      }
      for(const t of data[src].tasks||[]) push(t.text, src, src);
      for(const s of data[src].ideas||[]) push(s.text, src, src);
    }
    for(const c of data.aar.categories||[]) for(const it of c.items) push(it.text,"review · "+c.category,"aar");
    for(const L of data.lists||[]) for(const it of L.items) push(it.text, L.title||L.path, "list", L.path);
    return out;
  }

      if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); });
    try{
      // Stage 1 — the day and the calendar. Today paints as soon as this
      // returns, without waiting on the other notes.
      const cached = ctxCache[viewDate];
      const needCtx = !cached || Date.now()-cached.at > CTX_STALE_MS;
      const ctxP = needCtx ? api("/context?date="+encodeURIComponent(viewDate))
                                .then(r=>r.ok?r.json():null).catch(()=>null)
                           : Promise.resolve(cached.data);
      const b = await get("day");
      data = Object.assign({inbox:[], future:[], priorities:{projects:[],tasks:[]},
        stalled:{projects:[],items:[]}, aar:{path:"",categories:[]},
        lists:[], loading:true}, b);
      fetchedAt = Date.now(); dirty = false;
      setConn("online");
      render();
      ctxP.then(c=>{ if(needCtx) ctxCache[viewDate] = {at:Date.now(), data:c};
        data.context = c; renderRail(); });
      // Stage 2 — everything else, in the background.
      const rest = await get("inbox,priorities,future,stalled,aar,lists");
      const myDate = viewDate;
      if(myDate !== viewDate) return;             // you changed day meanwhile
      Object.assign(data, rest, {loading:false, missing:[...(data.missing||[]), ...(rest.missing||[])]});
      render();
    }catch(e){
      setConn("offline", "couldn't load");
      toastBad("couldn't load the board — "+e.message);
    }
  }

  // ── sidebar footer: last-save age ──────
  function updateFoot(){
    const f = $("sideFoot"); if(!f) return;
    if(queue.length){ f.textContent = queue.length+" unsaved"; return; }
    if(!fetchedAt){ f.textContent = "—"; return; }
    const s = Math.round((Date.now()-fetchedAt)/1000);
    f.textContent = s<60 ? "Saved · just now"
      : s<3600 ? "Saved · "+Math.round(s/60)+" min ago"
      : "Saved · "+Math.round(s/3600)+"h ago";
  }
  setInterval(updateFoot, 30000);

  // ── global wiring ──────────────────────
  $("menuBtn").addEventListener("click", ()=>{
    $("side").classList.toggle("open"); $("sideScrim").classList.toggle("open");
  });
  $("sideScrim").addEventListener("click", closeDrawer);
  document.querySelectorAll(".navitem[data-nav]").forEach(b=>
    b.addEventListener("click", ()=>go(b.dataset.nav)));
  $("prevDay").addEventListener("click",()=>{ viewDate=shiftD(viewDate,-1); nav="today"; refresh(); });
  $("nextDay").addEventListener("click",()=>{ viewDate=shiftD(viewDate,1); nav="today"; refresh(); });
  $("todayBtn").addEventListener("click",()=>{ viewDate=data?data.today:viewDate; nav="today"; refresh(); });
  $("refreshBtn").addEventListener("click",refresh);
  $("batchBtn").addEventListener("click", async ()=>{ await flush(); });
  $("discardBtn").addEventListener("click", discard);
  document.addEventListener("keydown",e=>{
    if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==="k"){
      e.preventDefault(); $("omni").focus(); $("omni").select(); return;
    }
    if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==="s"){
      e.preventDefault(); flush(); return;
    }
    if(e.target.matches("input,[contenteditable=true]")) return;
    if(e.key==="ArrowLeft"){ viewDate=shiftD(viewDate,-1); nav="today"; refresh(); }
    if(e.key==="ArrowRight"){ viewDate=shiftD(viewDate,1); nav="today"; refresh(); }
    if(e.key==="r"){ refresh(); }
    if(e.key==="Escape"){ closeSheets(); closeMove(); closeDrawer(); }
  });
  document.addEventListener("visibilitychange",()=>{
    if(document.hidden || !data) return;
    const age = Math.round((Date.now()-fetchedAt)/60000);
    if(dirty) setConn("online","edited · ↻");
    else if(age >= 2) setConn("online", age+"m old · ↻");
  });
  window.addEventListener("online",()=>setConn("online"));
  window.addEventListener("offline",()=>setConn("offline"));

  const now=new Date();
  viewDate = isoD(now);
  setConn(navigator.onLine?"online":"offline");
  if(!cfg.url) setTimeout(openSheet,300); else refresh();

  if("serviceWorker" in navigator){
    window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
  }
})();
</script>
</body>
</html>
