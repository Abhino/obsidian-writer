<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#0d1513" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Inbox" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-192.png" />
<title>Inbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0d1513; --bg-2:#111d1a; --surface:#15211e; --surface-2:#1b2925;
    --line:#25332e; --ink:#e9e6da; --muted:#8a978f; --faint:#5c6863;
    --accent:#e3a857; --accent-dim:#b9863f;
    --ok:#7fb88a; --warn:#d98a6a;
    --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
    --ui:"Hanken Grotesk",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  /* The `hidden` attribute only sets display:none in the BROWSER's default
     stylesheet, so any author rule with its own display (.today is
     display:flex) silently beats it and the "hidden" view renders anyway —
     which stacked today and outside on one page. This makes hidden
     mean hidden, everywhere. */
  [hidden]{display:none !important}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--ui); -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column;
    /* fill the phone, respect notches */
    min-height:100dvh;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap{flex:1; display:flex; flex-direction:column; max-width:680px; width:100%; margin:0 auto; min-height:0}

  /* ── header ───────────────────────────── */
  header{
    display:flex; align-items:baseline; gap:.6rem;
    padding:1.1rem 1.25rem .9rem; border-bottom:1px solid var(--line);
  }
  .mark{font-size:1.18rem; font-weight:700; letter-spacing:-.02em}
  .target{
    font-family:var(--mono); font-size:.72rem; color:var(--faint);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .status{margin-left:auto; display:flex; align-items:center; gap:.45rem; flex:none}
  .dot{width:7px; height:7px; border-radius:50%; background:var(--faint); transition:background .3s}
  .dot.online{background:var(--ok)}
  .dot.offline{background:var(--warn)}
  .status-txt{font-size:.7rem; color:var(--muted); font-variant-numeric:tabular-nums}
  .gear{
    background:none; border:none; color:var(--faint); cursor:pointer;
    padding:.2rem; margin-left:.2rem; display:flex; border-radius:8px;
  }
  .gear:hover{color:var(--muted)}
  .gear:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

  /* ── pinned notes ─────────────────────── */
  .pins{
    display:flex; gap:.5rem; overflow-x:auto; padding:.7rem 1.25rem;
    border-bottom:1px solid var(--line); scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
  }
  .pins::-webkit-scrollbar{display:none}
  .pins:empty{display:none}
  .chip{
    flex:none; display:inline-flex; align-items:center; gap:.4rem;
    background:var(--surface); border:1px solid var(--line); border-radius:999px;
    color:var(--ink); font-family:var(--ui); font-size:.82rem; font-weight:600;
    padding:.4rem .8rem .4rem .65rem; cursor:pointer; user-select:none;
    -webkit-user-select:none; -webkit-tap-highlight-color:transparent;
    transition:transform .1s, border-color .15s; max-width:60vw;
  }
  .chip:active{transform:scale(.96)}
  .chip:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  .chip .obs{color:var(--accent); flex:none; display:flex}
  .chip .lbl{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .chip.editing{border-color:var(--accent-dim); animation:wiggle .35s ease-in-out infinite}
  @keyframes wiggle{0%,100%{transform:rotate(-.6deg)} 50%{transform:rotate(.6deg)}}
  .chip.add{
    background:none; border-style:dashed; color:var(--muted); font-weight:500;
  }
  .chip.add:hover{color:var(--ink); border-color:var(--accent-dim)}

  /* ── stream ───────────────────────────── */
  .stream{
    flex:1; min-height:0; overflow-y:auto; padding:1.1rem 1.25rem .5rem;
    display:flex; flex-direction:column; gap:.7rem; justify-content:flex-end;
  }
  .empty{
    margin:auto 0; text-align:center; color:var(--faint);
    display:flex; flex-direction:column; gap:.5rem; align-items:center; padding:2rem 0;
  }
  .empty .glyph{font-family:var(--mono); font-size:1.6rem; color:var(--accent-dim); opacity:.7}
  .empty p{margin:0; font-size:.92rem; max-width:24ch; line-height:1.5}

  .note{
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:.7rem .85rem; animation:settle .34s cubic-bezier(.2,.7,.3,1);
  }
  @keyframes settle{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}
  .note .text{
    font-family:var(--mono); font-size:.9rem; line-height:1.5; color:var(--ink);
    white-space:pre-wrap; word-break:break-word;
  }
  .note .meta{
    display:flex; align-items:center; gap:.5rem; margin-top:.5rem;
    font-size:.7rem; color:var(--faint); font-variant-numeric:tabular-nums;
  }
  .pill{
    display:inline-flex; align-items:center; gap:.32rem;
    font-size:.66rem; font-weight:600; letter-spacing:.02em; text-transform:lowercase;
  }
  .pill.saving{color:var(--muted)}
  .pill.filed{color:var(--ok)}
  .pill.queued{color:var(--warn)}
  .pill .led{width:5px; height:5px; border-radius:50%; background:currentColor}
  .pill.saving .led{animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.3} 50%{opacity:1}}
  .retry{
    background:none; border:none; color:var(--warn); cursor:pointer;
    font-family:var(--ui); font-size:.7rem; font-weight:600; padding:0; text-decoration:underline;
  }

  /* ── composer ─────────────────────────── */
  .composer{
    border-top:1px solid var(--line); padding:.85rem 1rem 1rem;
    background:linear-gradient(180deg,transparent,var(--bg-2));
  }
  .field{
    position:relative; background:var(--surface); border:1px solid var(--line);
    border-radius:16px; padding:.2rem .25rem .2rem; transition:border-color .2s;
  }
  .field:focus-within{border-color:var(--accent-dim)}
  textarea{
    width:100%; resize:none; border:none; background:none; color:var(--ink);
    font-family:var(--mono); font-size:1rem; line-height:1.55; padding:.7rem .8rem .2rem;
    max-height:42vh; outline:none; caret-color:var(--accent);
  }
  textarea::placeholder{color:var(--faint)}
  .bar{display:flex; align-items:center; gap:.6rem; padding:.15rem .6rem .35rem .8rem}
  .hint{font-size:.68rem; color:var(--faint); font-family:var(--mono)}
  .send{
    margin-left:auto; display:inline-flex; align-items:center; gap:.4rem;
    background:var(--accent); color:#1a1206; border:none; border-radius:11px;
    font-family:var(--ui); font-weight:700; font-size:.86rem; letter-spacing:-.01em;
    padding:.5rem .9rem; cursor:pointer; transition:transform .1s, opacity .2s;
  }
  .send:active{transform:scale(.97)}
  .send:disabled{opacity:.4; cursor:default}
  .send:focus-visible{outline:2px solid var(--ink); outline-offset:2px}

  /* ── settings sheet ───────────────────── */
  .scrim{
    position:fixed; inset:0; background:rgba(4,8,7,.6); backdrop-filter:blur(3px);
    opacity:0; pointer-events:none; transition:opacity .22s; z-index:10;
  }
  .scrim.open{opacity:1; pointer-events:auto}
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:11;
    background:var(--bg-2); border-top:1px solid var(--line);
    border-radius:20px 20px 0 0; padding:1.1rem 1.25rem calc(1.4rem + env(safe-area-inset-bottom));
    max-width:680px; margin:0 auto;
    transform:translateY(100%); transition:transform .26s cubic-bezier(.2,.7,.3,1);
  }
  .sheet.open{transform:none}
  .sheet h2{margin:.2rem 0 1rem; font-size:1.02rem; font-weight:700; letter-spacing:-.01em}
  .sheet label{display:block; font-size:.74rem; color:var(--muted); margin:.9rem 0 .3rem; font-weight:600}
  .sheet select{
    width:100%; background:var(--surface-2); border:1px solid var(--line);
    color:var(--ink); font:inherit; font-size:.86rem; padding:.6rem .7rem;
    border-radius:9px; outline:none;
  }
  .sheet input{
    width:100%; background:var(--surface); border:1px solid var(--line); border-radius:10px;
    color:var(--ink); font-family:var(--mono); font-size:.86rem; padding:.6rem .7rem; outline:none;
  }
  .sheet input:focus{border-color:var(--accent-dim)}
  .row{display:flex; gap:.6rem; align-items:center; margin-top:1.2rem}
  .test{
    background:var(--surface-2); color:var(--ink); border:1px solid var(--line);
    border-radius:10px; font-family:var(--ui); font-weight:600; font-size:.82rem;
    padding:.6rem .9rem; cursor:pointer;
  }
  .save{
    margin-left:auto; background:var(--accent); color:#1a1206; border:none; border-radius:10px;
    font-family:var(--ui); font-weight:700; font-size:.86rem; padding:.6rem 1.1rem; cursor:pointer;
  }
  .test:focus-visible,.save:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  .test-result{font-size:.74rem; margin-top:.7rem; font-family:var(--mono); min-height:1em}
  .test-result.ok{color:var(--ok)}
  .test-result.bad{color:var(--warn)}

  /* ── tabs ─────────────────────────────── */
  .tabs{display:flex; gap:.25rem; padding:.45rem 1.25rem 0; border-bottom:1px solid var(--line)}
  .tab{
    background:none; border:none; color:var(--muted); cursor:pointer;
    font-family:var(--ui); font-weight:600; font-size:.85rem;
    padding:.45rem .8rem .55rem; border-bottom:2px solid transparent; margin-bottom:-1px;
    -webkit-tap-highlight-color:transparent;
  }
  .tab.active{color:var(--ink); border-bottom-color:var(--accent)}
  .tab:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

  /* ── today view ───────────────────────── */
  .today{
    flex:1; min-height:0; overflow-y:auto; padding:1rem 1.25rem 1.6rem;
    display:flex; flex-direction:column; gap:.85rem;
  }
  .jobs{display:flex; gap:.5rem; flex-wrap:wrap; align-items:center}
  .job{
    background:var(--surface-2); border:1px solid var(--line); color:var(--muted);
    font:inherit; font-size:.76rem; padding:.38rem .75rem; border-radius:8px; cursor:pointer;
  }
  .job:disabled{opacity:.45; cursor:default}
  .job:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  .job.icon{margin-left:auto; font-size:1.02rem; padding:.38rem .7rem; line-height:1}

  .tv-date{font-family:var(--mono); font-size:.73rem; color:var(--faint)}
  .tv-section{
    font-size:.7rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase;
    color:var(--faint); margin:.7rem 0 .1rem;
  }
  .task-row{
    display:flex; align-items:flex-start; gap:.6rem; padding:.48rem 0;
    border-bottom:1px solid var(--line); cursor:pointer; user-select:none;
    -webkit-user-select:none; -webkit-tap-highlight-color:transparent;
  }
  .task-row:last-child{border-bottom:none}
  .task-row .cb{
    flex:none; width:19px; height:19px; border:1.5px solid var(--faint);
    border-radius:6px; margin-top:.12rem; display:flex; align-items:center;
    justify-content:center; color:transparent; transition:background .15s, border-color .15s;
  }
  .task-row.done .cb{background:var(--ok); border-color:var(--ok); color:#10231a}
  .task-row.pending .cb{border-color:var(--accent); animation:pulse 1s ease-in-out infinite}
  .task-row .tx{font-family:var(--mono); font-size:.86rem; line-height:1.5; word-break:break-word}
  .task-row.done .tx{color:var(--faint); text-decoration:line-through}
  .task-row.struct{cursor:default}
  .task-row.struct .cb{visibility:hidden}
  .task-row.struct .tx{color:var(--accent-dim); font-weight:600}
  .badge{
    display:inline-block; font-family:var(--mono); font-size:.62rem; color:var(--accent-dim);
    border:1px solid var(--line); border-radius:6px; padding:0 .3rem; margin-left:.45rem;
    vertical-align:1px;
  }
  .cal-line{
    font-family:var(--mono); font-size:.8rem; color:var(--muted);
    padding:.32rem 0; line-height:1.5; word-break:break-word;
    display:flex; gap:.55rem; align-items:baseline;
  }
  .cal-line .when{color:var(--accent-dim); font-weight:600; flex:none}
  .cal-line .where{color:var(--faint); font-size:.72rem}
  /* live context from /context — never stored in the vault */
  .ctx{
    display:flex; gap:.5rem; align-items:center; flex-wrap:wrap;
    font-family:var(--mono); font-size:.72rem; color:var(--muted);
    padding:.5rem .7rem; background:var(--surface-2);
    border:1px solid var(--line); border-radius:10px;
  }
  .ctx .sep{color:var(--faint)}
  .ctx.stale{color:var(--faint)}
  .blk-head{
    display:flex; align-items:baseline; gap:.5rem;
    font-size:.7rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase;
    color:var(--faint); margin:1rem 0 .1rem;
  }
  .blk-head .span{font-family:var(--mono); font-size:.66rem; letter-spacing:0;
                  text-transform:none; color:var(--accent-dim)}
  .blk-head.now{color:var(--accent)}
  .tv-empty{
    margin:2.2rem 0; text-align:center; color:var(--faint);
    display:flex; flex-direction:column; gap:.9rem; align-items:center;
  }
  .tv-empty p{margin:0; font-size:.92rem}
  .toast{
    position:fixed; left:50%; transform:translateX(-50%);
    bottom:calc(1.2rem + env(safe-area-inset-bottom));
    background:var(--surface-2); border:1px solid var(--line); color:var(--ink);
    font-size:.8rem; padding:.55rem .95rem; border-radius:10px; z-index:20;
    opacity:0; transition:opacity .2s; pointer-events:none; max-width:88vw; text-align:center;
  }
  .toast.show{opacity:1; pointer-events:auto}
  .toast .undo{
    background:none; border:none; color:var(--accent); font:inherit; font-weight:700;
    margin-left:.7rem; cursor:pointer; padding:0;
  }
  /* compose target switch — inbox vs the standing errand list */
  .targets{display:flex; gap:.3rem; margin-right:auto}
  .targets button{
    background:none; border:1px solid transparent; color:var(--faint);
    font:inherit; font-size:.68rem; font-family:var(--mono);
    padding:.15rem .45rem; border-radius:6px; cursor:pointer;
  }
  .targets button.on{color:var(--accent); border-color:var(--accent-dim)}

  /* ── shared view chrome: head, panels, footnote ── */
  /* capture earns its calm from soft cards and generous space; the list
     views now use the same vocabulary instead of naked rows. */
  .vhead{display:flex; align-items:flex-start; gap:.6rem; padding-bottom:.2rem}
  .vh-txt{flex:1; min-width:0}
  .vh-title{font-size:1.28rem; font-weight:700; letter-spacing:-.025em; line-height:1.15}
  .vh-meta{font-size:.74rem; color:var(--muted); margin-top:.15rem;
           white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .vh-dot{width:9px; height:9px; border-radius:50%; background:var(--faint);
          margin-top:.42rem; flex:none}
  .vh-act{
    flex:none; width:34px; height:34px; background:var(--surface-2);
    border:1px solid var(--line); color:var(--muted); border-radius:10px;
    font:inherit; font-size:1rem; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    -webkit-tap-highlight-color:transparent;
  }
  .vh-act:active{transform:scale(.95)}
  .vh-act:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  .panel{
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:.55rem .8rem;
  }
  .panel + .panel{margin-top:.6rem}
  .panel-head{
    display:flex; align-items:baseline; gap:.5rem; padding:.35rem 0 .45rem;
    font-size:.68rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase;
    color:var(--muted);
  }
  .panel-head .span{font-family:var(--mono); font-size:.66rem; letter-spacing:0;
                    text-transform:none; color:var(--faint)}
  .panel-head .n{margin-left:auto; font-family:var(--mono); font-size:.68rem;
                 letter-spacing:0; color:var(--faint); font-weight:500}
  .panel-head.now{color:var(--accent)}
  .vfoot{font-family:var(--mono); font-size:.64rem; color:var(--faint);
         opacity:.65; text-align:center; padding:.9rem 0 .2rem}
  .vhint{font-size:.72rem; color:var(--faint); text-align:center; padding:.8rem 0 .2rem}

  /* today: collapsed parent → next step */
  .pt{border-bottom:1px solid var(--line); padding:.2rem 0}
  .pt:last-child{border-bottom:none}
  .pt .pt-head{
    display:flex; align-items:baseline; gap:.5rem; padding:.3rem 0 0;
    cursor:pointer; user-select:none; -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  .pt .pt-head .pt-tx{font-size:.76rem; font-weight:600; color:var(--muted);
    word-break:break-word; flex:1}
  .pt .pt-head .pt-prog{font-family:var(--mono); font-size:.66rem; color:var(--accent-dim); flex:none}
  .pt .pt-head .chev{color:var(--faint); font-size:.66rem; flex:none}
  .pt .next-lbl{font-size:.6rem; font-weight:700; letter-spacing:.08em;
    text-transform:uppercase; color:var(--faint); margin:.25rem 0 0}
  .pt .task-row{border-bottom:none}
  .pt-redo{background:none; border:none; color:var(--faint); font-family:var(--mono);
    font-size:.64rem; cursor:pointer; flex:none; padding:0 .2rem}
  .pt-redo:hover{color:var(--accent)}

  @media (prefers-reduced-motion:reduce){
    *{animation:none !important; transition:none !important}
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <span class="mark">inbox</span>
      <span class="target" id="target">00 Inbox.md</span>
      <span class="status">
        <span class="dot" id="dot"></span>
        <span class="status-txt" id="statusTxt">—</span>
      </span>
      <button class="gear" id="gearBtn" aria-label="Settings">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </header>

    <nav class="tabs" id="tabs" role="tablist">
      <button class="tab active" data-view="capture" role="tab">capture</button>
      <button class="tab" data-view="today" role="tab">today</button>
      <button class="tab" data-view="outside" role="tab">outside</button>
    </nav>

    <div class="pins" id="pins"></div>

    <div class="stream" id="stream"></div>

    <div class="today" id="viewToday" hidden>
      <div class="vhead">
        <div class="vh-txt">
          <div class="vh-title">Today</div>
          <div class="vh-meta" id="todayMeta">&nbsp;</div>
        </div>
        <button class="vh-act" id="todayRefresh" aria-label="Refresh">↻</button>
      </div>
      <div id="todayBody"></div>
    </div>

    <div class="today" id="viewOutside" hidden>
      <div class="vhead">
        <div class="vh-txt">
          <div class="vh-title" id="outsideTitle">Outside</div>
          <div class="vh-meta" id="outsideMeta">&nbsp;</div>
        </div>
        <button class="vh-act" id="outsideRefresh" aria-label="Refresh">↻</button>
      </div>
      <div id="outsideBody"></div>
    </div>

    <div class="composer">
      <div class="field">
        <textarea id="input" rows="1" placeholder="write a thought…" autocomplete="off" autocapitalize="sentences"></textarea>
        <div class="bar">
          <div class="targets" id="targets">
            <button data-t="inbox" class="on">inbox</button>
            <button data-t="outside">outside</button>
          </div>
          <span class="hint" id="hint">⌘↵</span>
          <button class="send" id="sendBtn" disabled>capture
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet" role="dialog" aria-label="Settings">
    <h2>Connection</h2>
    <label for="cfgUrl">Backend URL</label>
    <input id="cfgUrl" inputmode="url" placeholder="https://your-service-xxxx.run.app" />
    <label for="cfgToken">Capture token</label>
    <input id="cfgToken" type="password" placeholder="the shared secret your backend expects" />
    <label for="cfgTarget">Inbox note</label>
    <input id="cfgTarget" placeholder="AutomatedNotes/00 Inbox.md" />
    <label for="cfgOutside">Outside list note</label>
    <input id="cfgOutside" placeholder="outside-list.md" />
    <label for="cfgVault">Obsidian vault name</label>
    <input id="cfgVault" placeholder="exact vault name, for Open-in-Obsidian" />
    <div class="test-result" id="testResult"></div>
    <div class="row">
      <button class="test" id="testBtn">Test connection</button>
      <button class="save" id="saveBtn">Save</button>
    </div>
  </div>

  <div class="sheet" id="pinSheet" role="dialog" aria-label="Pin a note">
    <h2 id="pinSheetTitle">Pin a note</h2>
    <label for="pinLabel">Button label</label>
    <input id="pinLabel" placeholder="e.g. Goals" />
    <label for="pinFile">Note path from vault root</label>
    <input id="pinFile" placeholder="e.g. Areas/Goals.md" />
    <label for="pinMode">Opens as</label>
    <select id="pinMode">
      <option value="link">Obsidian link — needs the vault to have synced</option>
      <option value="list">Live list — reads through the backend, tappable</option>
    </select>
    <div class="row">
      <button class="test" id="pinDeleteBtn" style="display:none; color:var(--warn)">Remove</button>
      <button class="save" id="pinSaveBtn">Save pin</button>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>

<script>
(function(){
  "use strict";
  const LS = {
    get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
    set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
  };
  const $ = id => document.getElementById(id);

  let cfg = LS.get("inbox.cfg", { url:"", token:"", target:"AutomatedNotes/00 Inbox.md",
                                  outside:"outside-list.md", vault:"" });
  // which note the composer writes to. /capture already accepts a target,
  // so an errand needs no new endpoint — only somewhere to aim.
  let composeTarget = LS.get("inbox.composeTarget", "inbox");
  let queue = LS.get("inbox.queue", []);        // captures awaiting the backend
  let pins = LS.get("inbox.pins", []);          // [{id, label, file, mode}]
  let session = [];                              // what we show this session
  let pinEditMode = false;                        // wiggle / tap-to-edit
  let lastOk = null;

  const stream=$("stream"), input=$("input"), sendBtn=$("sendBtn"),
        dot=$("dot"), statusTxt=$("statusTxt"), targetEl=$("target"), pinsEl=$("pins");

  // ── pinned notes ───────────────────────
  // the note the composer currently writes to
  function targetPath(){
    return composeTarget==="outside"
      ? (cfg.outside||"outside-list.md")
      : (cfg.target||"AutomatedNotes/00 Inbox.md");
  }
  function setComposeTarget(t){
    composeTarget = t; LS.set("inbox.composeTarget", t);
    document.querySelectorAll("#targets button")
      .forEach(b=>b.classList.toggle("on", b.dataset.t===t));
    targetEl.textContent = targetPath().split("/").pop();
    input.placeholder = t==="outside" ? "an errand for when you're out…"
                                      : "write a thought…";
  }

  function encPath(p){
    // encode each segment, keep slashes as %2F per Obsidian URI rules
    return p.split("/").map(encodeURIComponent).join("%2F");
  }
  function openInObsidian(file){
    if(!cfg.vault){ openSheet(); return; }      // need a vault name first
    const url = "obsidian://open?vault=" + encodeURIComponent(cfg.vault) +
                "&file=" + encPath(file.replace(/\.md$/,""));
    // a user-gesture navigation hands the obsidian:// link to the OS
    window.location.href = url;
  }
  function renderPins(){
    pinsEl.innerHTML = "";
    for(const p of pins){
      const chip=document.createElement("button");
      chip.className="chip"+(pinEditMode?" editing":"");
      chip.innerHTML =
        '<span class="obs"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" '+
        'stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+
        '<path d="M5 3v16l7-4 7 4V3z"/></svg></span>'+
        '<span class="lbl"></span>';
      chip.querySelector(".lbl").textContent = p.label;
      // tap: open (or edit, if in edit mode); long-press: enter edit + open editor
      let timer=null, longed=false;
      const start=()=>{ longed=false; timer=setTimeout(()=>{ longed=true; openPinSheet(p); }, 500); };
      const cancel=()=>{ if(timer) clearTimeout(timer); };
      chip.addEventListener("pointerdown", start);
      chip.addEventListener("pointerup", cancel);
      chip.addEventListener("pointerleave", cancel);
      chip.addEventListener("click", ()=>{
        if(longed) return;                  // long-press already handled it
        if(pinEditMode){ openPinSheet(p); return; }
        // a `list` pin renders live through the backend — the whole point,
        // since mobile Obsidian shows a vault that hasn't synced
        if(p.mode==="list") showList(p.file, p.label);
        else openInObsidian(p.file);
      });
      pinsEl.append(chip);
    }
    const add=document.createElement("button");
    add.className="chip add";
    add.innerHTML='<span class="obs">+</span><span class="lbl">pin a note</span>';
    add.addEventListener("click", ()=>openPinSheet(null));
    pinsEl.append(add);
  }

  // ── rendering ──────────────────────────
  function fmtTime(ts){
    return new Date(ts).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
  }
  function render(){
    targetEl.textContent = targetPath().split("/").pop();
    if(!session.length){
      stream.innerHTML =
        '<div class="empty"><span class="glyph">⌗</span>'+
        '<p>Nothing captured yet. Write a thought and it lands in your inbox.</p></div>';
      return;
    }
    stream.innerHTML = "";
    for(const n of session){
      const el=document.createElement("div"); el.className="note";
      const t=document.createElement("div"); t.className="text"; t.textContent=n.text;
      const m=document.createElement("div"); m.className="meta";
      const time=document.createElement("span"); time.textContent=fmtTime(n.ts);
      const pill=document.createElement("span"); pill.className="pill "+n.status;
      const label={saving:"saving",filed:"filed",queued:"queued"}[n.status]||n.status;
      pill.innerHTML='<span class="led"></span>'+label;
      m.append(time, pill);
      if(n.status==="queued"){
        const r=document.createElement("button"); r.className="retry"; r.textContent="retry";
        r.onclick=()=>flush(true); m.append(r);
      }
      el.append(t,m); stream.append(el);
    }
    stream.scrollTop = stream.scrollHeight;
  }

  function setConn(state){ // "online" | "offline" | null
    dot.className="dot"+(state?" "+state:"");
    if(state==="online") statusTxt.textContent = queue.length? queue.length+" queued" : "synced";
    else if(state==="offline") statusTxt.textContent = queue.length? queue.length+" queued" : "offline";
    else statusTxt.textContent = "—";
  }

  // ── capture flow ───────────────────────
  function capture(){
    let text=input.value.trim();
    if(!text) return;
    const item={ id:Date.now()+""+Math.random().toString(36).slice(2,6), text,
                 ts:Date.now(), status:"saving", target:targetPath() };
    session.push(item);
    input.value=""; autosize(); sendBtn.disabled=true; render();
    send(item);
  }

  async function send(item){
    if(!cfg.url){ markQueued(item); openSheet(); return; }
    try{
      const res=await fetch(cfg.url.replace(/\/+$/,"")+"/capture",{
        method:"POST",
        headers:{ "Content-Type":"application/json", "Authorization":"Bearer "+(cfg.token||"") },
        body:JSON.stringify({ text:item.text, ts:new Date(item.ts).toISOString(), target:item.target||cfg.target })
      });
      if(!res.ok) throw new Error("HTTP "+res.status);
      item.status="filed"; lastOk=Date.now(); setConn("online"); render();
    }catch(e){
      markQueued(item);
    }
  }

  function markQueued(item){
    item.status="queued";
    if(!queue.find(q=>q.id===item.id)) queue.push({id:item.id, text:item.text, ts:item.ts});
    LS.set("inbox.queue", queue);
    setConn(navigator.onLine? "online":"offline");
    render();
  }

  // resend everything in the queue; called on load, reconnect, manual retry
  async function flush(force){
    if(!cfg.url || (!navigator.onLine && !force) || !queue.length) return;
    const pending=[...queue];
    for(const q of pending){
      try{
        const res=await fetch(cfg.url.replace(/\/+$/,"")+"/capture",{
          method:"POST",
          headers:{ "Content-Type":"application/json", "Authorization":"Bearer "+(cfg.token||"") },
          body:JSON.stringify({ text:q.text, ts:new Date(q.ts).toISOString(), target:q.target||cfg.target })
        });
        if(!res.ok) throw new Error("HTTP "+res.status);
        queue=queue.filter(x=>x.id!==q.id);
        LS.set("inbox.queue", queue);
        const s=session.find(x=>x.id===q.id); if(s){ s.status="filed"; }
        lastOk=Date.now();
      }catch(e){ break; } // stop on first failure, keep order
    }
    setConn(navigator.onLine? "online":"offline");
    render();
  }

  // ── composer behaviour ─────────────────
  function autosize(){ input.style.height="auto"; input.style.height=Math.min(input.scrollHeight, window.innerHeight*0.42)+"px"; }
  input.addEventListener("input",()=>{ autosize(); sendBtn.disabled=!input.value.trim(); });
  input.addEventListener("keydown",e=>{
    if(e.key==="Enter" && (e.metaKey||e.ctrlKey)){ e.preventDefault(); capture(); }
  });
  sendBtn.addEventListener("click",capture);

  // ── settings sheet ─────────────────────
  const scrim=$("scrim"), sheet=$("sheet"), pinSheet=$("pinSheet");
  function openSheet(){
    pinSheet.classList.remove("open");
    $("cfgUrl").value=cfg.url||""; $("cfgToken").value=cfg.token||"";
    $("cfgTarget").value=cfg.target||"AutomatedNotes/00 Inbox.md";
    $("cfgOutside").value=cfg.outside||"outside-list.md";
    $("cfgVault").value=cfg.vault||"";
    $("testResult").textContent=""; $("testResult").className="test-result";
    scrim.classList.add("open"); sheet.classList.add("open");
  }
  function closeSheet(){
    scrim.classList.remove("open"); sheet.classList.remove("open"); pinSheet.classList.remove("open");
    if(pinEditMode){ pinEditMode=false; renderPins(); }
  }
  $("gearBtn").addEventListener("click",openSheet);
  scrim.addEventListener("click",()=>{ closeSheet();
    if(typeof closeSheets==="function"){ closeSheets(); } });
  $("saveBtn").addEventListener("click",()=>{
    cfg={
      url:$("cfgUrl").value.trim(),
      token:$("cfgToken").value,
      target:$("cfgTarget").value.trim()||"AutomatedNotes/00 Inbox.md",
      outside:$("cfgOutside").value.trim()||"outside-list.md",
      vault:$("cfgVault").value.trim()
    };
    LS.set("inbox.cfg", cfg); closeSheet(); render(); renderPins(); flush(true);
  });
  $("testBtn").addEventListener("click",async()=>{
    const url=$("cfgUrl").value.trim(); const out=$("testResult");
    if(!url){ out.className="test-result bad"; out.textContent="enter a backend URL first"; return; }
    out.className="test-result"; out.textContent="checking…";
    try{
      const r=await fetch(url.replace(/\/+$/,"")+"/health",{method:"GET"});
      if(r.ok){ out.className="test-result ok"; out.textContent="reachable ✓"; }
      else{ out.className="test-result bad"; out.textContent="responded "+r.status; }
    }catch(e){ out.className="test-result bad"; out.textContent="could not reach service"; }
  });

  // ── pin sheet (add / edit / remove) ────
  let editingPin = null;
  function openPinSheet(pin){
    sheet.classList.remove("open");
    editingPin = pin;
    $("pinSheetTitle").textContent = pin ? "Edit pin" : "Pin a note";
    $("pinLabel").value = pin ? pin.label : "";
    $("pinFile").value  = pin ? pin.file  : "";
    $("pinMode").value  = (pin && pin.mode) || "link";
    $("pinDeleteBtn").style.display = pin ? "" : "none";
    scrim.classList.add("open"); pinSheet.classList.add("open");
    if(!pin) setTimeout(()=>$("pinLabel").focus(), 80);
  }
  $("pinSaveBtn").addEventListener("click",()=>{
    const label=$("pinLabel").value.trim();
    const file=$("pinFile").value.trim();
    if(!label || !file) return;
    const mode=$("pinMode").value==="list"?"list":"link";
    if(editingPin){
      editingPin.label=label; editingPin.file=file; editingPin.mode=mode;
    }else{
      pins.push({ id:Date.now()+""+Math.random().toString(36).slice(2,5), label, file, mode });
    }
    LS.set("inbox.pins", pins);
    pinEditMode=false; closeSheet(); renderPins();
  });
  $("pinDeleteBtn").addEventListener("click",()=>{
    if(editingPin){ pins=pins.filter(p=>p!==editingPin); LS.set("inbox.pins", pins); }
    pinEditMode=false; closeSheet(); renderPins();
  });

  // ── backend api helper ─────────────────
  function api(path, opts){
    return fetch(cfg.url.replace(/\/+$/,"")+path, Object.assign({
      headers:{ "Content-Type":"application/json", "Authorization":"Bearer "+(cfg.token||"") }
    }, opts||{}));
  }
  function el(tag, cls){ const e=document.createElement(tag); if(cls) e.className=cls; return e; }

  // ── toast ──────────────────────────────
  const toast=$("toast"); let toastTimer=null;
  function showToast(msg){
    toast.innerHTML=""; toast.textContent=msg; toast.classList.add("show");
    clearTimeout(toastTimer); toastTimer=setTimeout(()=>toast.classList.remove("show"), 2600);
  }

  // ── views: capture ⇄ today ⇄ outside ───
  const viewToday=$("viewToday"), todayBody=$("todayBody"),
        viewOutside=$("viewOutside"), outsideBody=$("outsideBody"),
        composerEl=document.querySelector(".composer");
  let curView="capture", todayData=null, todayCtx=null, todayFetchedAt=0;
  let listData=null, listPath=null, listLabel="outside";
  const TODAY_STALE_MS=60000;

  function switchView(v){
    curView=v;
    if(typeof closeSheets==="function") closeSheets();
    document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active", t.dataset.view===v));
    const cap = v==="capture";
    pinsEl.style.display = cap? "" : "none";
    stream.style.display = cap? "" : "none";
    composerEl.style.display = cap? "" : "none";
    // Inline display, not just the `hidden` attribute: `hidden` only sets
    // display:none in the browser's DEFAULT stylesheet, and .today carries
    // its own display:flex — an author rule, which always wins. That's why
    // today and outside all rendered stacked on one page. Inline
    // style beats both, and is what the capture elements above already use.
    const show=(elm,on)=>{ elm.hidden=!on; elm.style.display = on? "flex" : "none"; };
    show(viewToday,   v==="today");
    show(viewOutside, v==="outside");
    if(v==="today" && (!todayData || Date.now()-todayFetchedAt > TODAY_STALE_MS)) fetchToday();
    if(v==="outside" && !listData)
      openList(listPath||cfg.outside||"outside-list.md", listLabel);
  }
  document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>switchView(t.dataset.view)));

  // parents whose step ladder is unfolded this session (by task text —
  // the same identity /check matches on)
  const expandedParents=new Set();

  // ── today view ─────────────────────────
  // /today and /context are fetched in PARALLEL and rendered independently.
  // The month file holds the record; the calendar and forecast are live and
  // never stored. A Calendar outage therefore costs the context strip, not
  // the task list.
  async function fetchToday(){
    if(!cfg.url){ openSheet(); return; }
    todayBody.innerHTML='<div class="tv-empty"><span class="glyph">⌗</span><p>Loading…</p></div>';
    const pToday=api("/today").then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); });
    const pCtx=api("/context").then(r=>r.ok? r.json():null).catch(()=>null);
    try{
      todayData=await pToday; todayFetchedAt=Date.now();
      lastOk=Date.now(); setConn("online");
    }catch(e){
      todayBody.innerHTML="";
      const box=el("div","tv-empty");
      $("todayMeta").textContent="couldn't load";
      const p=el("p"); p.textContent="Couldn't load today's list.";
      const b=el("button","job"); b.textContent="retry"; b.addEventListener("click",fetchToday);
      box.append(p,b); todayBody.append(box);
      return;
    }
    renderToday();
    todayCtx=await pCtx;                 // may be null; renderToday copes
    renderToday();
  }

  const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  function fmtDate(iso){
    const p=(iso||"").split("-");
    if(p.length!==3) return iso||"";
    const d=new Date(+p[0], +p[1]-1, +p[2]);
    return DOW[d.getDay()]+" "+(+p[2])+" "+MON[d.getMonth()];
  }
  function plural(n, word){ return n+" "+word+(n===1?"":"s"); }

  function fmtHint(m){
    const h=Math.floor(m/60), r=m%60;
    return "~"+(h&&r? h+"h"+r+"m" : h? h+"h" : r+"m");
  }

  function taskRow(n, depth, onToggle){
    const row=el("div","task-row"+(n.box? (n.checked?" done":"") : " struct"));
    row.style.paddingLeft=(depth*1.1)+"rem";
    const cb=el("span","cb");
    cb.innerHTML='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
    const tx=el("span","tx"); tx.textContent=n.text;
    if(n.hint){ const bd=el("span","badge"); bd.textContent=fmtHint(n.hint); tx.append(bd); }
    row.append(cb);
    row.append(tx);
    if(n.box) row.addEventListener("click",()=>(onToggle||toggleTask)(row,n));
    return row;
  }

  function renderContext(){
    if(!todayCtx) return;
    const c=el("div","ctx");
    const bits=[];
    if(todayCtx.weather && todayCtx.weather.summary)
      bits.push((todayCtx.weather.place? todayCtx.weather.place+" ":"")+todayCtx.weather.summary);
    const evs=todayCtx.events||[];
    bits.push(evs.length? evs.length+" event"+(evs.length===1?"":"s") : "no events");
    bits.forEach((b,i)=>{
      if(i){ const s=el("span","sep"); s.textContent="·"; c.append(s); }
      const s=el("span"); s.textContent=b; c.append(s);
    });
    todayBody.append(c);
    for(const ev of evs){
      const ln=el("div","cal-line");
      const w=el("span","when"); w.textContent=ev.all_day? "all day" : (ev.start||"");
      const t=el("span"); t.textContent=ev.title;
      ln.append(w,t);
      if(ev.location){ const p=el("span","where"); p.textContent="📍 "+ev.location; ln.append(p); }
      todayBody.append(ln);
    }
  }

  // the head's meta line: what today actually costs, counted from the
  // same hints the scheduler budgeted with
  function todayMetaLine(d){
    const bits=[fmtDate(d.date)];
    if(!d.exists){ bits.push("not built yet"); return bits.join(" · "); }
    let open=0, done=0, mins=0;
    for(const n of d.tasks||[]){
      if(!n.box) continue;
      if(n.checked) done++;
      else { open++; mins+=n.hint||0; }
    }
    bits.push(plural(open,"task"));
    if(done) bits.push(done+" done");
    if(mins) bits.push(fmtHint(mins).replace("~",""));
    return bits.join(" · ");
  }

  function renderToday(){
    todayBody.innerHTML="";
    const d=todayData;
    if(!d) return;
    $("todayMeta").textContent=todayMetaLine(d);
    if(!d.exists){
      renderContext();
      const box=el("div","tv-empty");
      const g=el("span","glyph"); g.textContent="⌗";
      const p=el("p"); p.textContent="No list yet for "+fmtDate(d.date)+".";
      const s=el("p"); s.style.fontSize=".78rem"; s.style.color="var(--faint)";
      s.textContent="The morning run builds it at 8am.";
      box.append(g,p,s);
      todayBody.append(box);
      if((d.done||[]).length){
        const panel=el("div","panel");
        const h=el("div","panel-head");
        const t=el("span"); t.textContent="already done"; h.append(t);
        const n=el("span","n"); n.textContent=d.done.length; h.append(n);
        panel.append(h);
        for(const nd of d.done) panel.append(taskRow(nd,0,()=>{}));
        todayBody.append(panel);
      }
      const foot=el("div","vfoot"); foot.textContent=d.path; todayBody.append(foot);
      return;
    }
    renderContext();

    // group by the `| Block` hint the scheduler stamped on each task. That
    // replaces the old `#### Morning` subsections in the markdown — same
    // layout, but the file stays a flat record.
    const order=(todayCtx&&todayCtx.blocks? todayCtx.blocks.map(b=>b.name) : d.blocks||[]);
    const spans={}; (todayCtx&&todayCtx.blocks||[]).forEach(b=>{spans[b.name]=b.start+"–"+b.end;});
    const groups=new Map(); order.forEach(b=>groups.set(b,[]));
    const loose=[];
    for(const n of d.tasks||[]){
      const b=n.block;
      if(b && groups.has(b)) groups.get(b).push(n); else loose.push(n);
    }
    // A parent with unchecked subtasks collapses to just its NEXT one, so
    // you only ever face a single step. Tap the small title to see the
    // full ladder.
    const walk=(nodes,depth,into)=>{
      const host=into||todayBody;
      for(const n of nodes||[]){
        const steps=(n.children||[]).filter(c=>c.box);
        const open=steps.filter(c=>!c.checked);
        if(n.box && !n.checked && open.length && !expandedParents.has(n.text)){
          const box=el("div","pt");
          const head=el("div","pt-head");
          const tx=el("span","pt-tx"); tx.textContent=n.text;
          const prog=el("span","pt-prog");
          prog.textContent=(steps.length-open.length)+"/"+steps.length;
          const ch=el("span","chev"); ch.textContent="▸";
          head.append(tx,prog,ch);
          head.addEventListener("click",()=>{ expandedParents.add(n.text); renderToday(); });
          const lbl=el("div","next-lbl"); lbl.textContent="next";
          box.append(head,lbl,taskRow(open[0],depth));
          host.append(box);
          continue;
        }
        const row=taskRow(n,depth);
        if(n.box && !n.checked && open.length && expandedParents.has(n.text)){
          const back=el("button","pt-redo"); back.textContent="▾ fold";
          back.addEventListener("click",e=>{ e.stopPropagation();
            expandedParents.delete(n.text); renderToday(); });
          row.append(back);
        }
        host.append(row);
        walk(n.children,depth+1,into);
      }
    };
    // top-level only, so a panel's count agrees with the head's task count —
    // steps are how ONE task gets done, not additional tasks
    const openCount=ns=>(ns||[]).filter(n=>n.box && !n.checked).length;
    const panelFor=(name, span, nodes)=>{
      const panel=el("div","panel");
      const h=el("div","panel-head");
      const t=el("span"); t.textContent=name; h.append(t);
      if(span){ const s=el("span","span"); s.textContent=span; h.append(s); }
      const n=el("span","n");
      const oc=openCount(nodes);
      n.textContent=oc? oc : "done";
      h.append(n);
      panel.append(h);
      walk(nodes,0,panel);
      todayBody.append(panel);
    };
    for(const [name,nodes] of groups){
      if(!nodes.length) continue;
      panelFor(name, spans[name], nodes);
    }
    if(loose.length){
      panelFor("anytime", null, loose);
    }
    const foot=el("div","vfoot"); foot.textContent=d.path; todayBody.append(foot);
  }

  // one flip in flight at a time keeps optimistic state trivially correct
  let toggling=false;
  async function toggleTask(row, n){
    if(toggling) return;
    const want=!n.checked;
    toggling=true;
    row.classList.add("pending"); row.classList.toggle("done", want);
    try{
      const r=await api("/check",{ method:"POST",
        body:JSON.stringify({ date:todayData.date, text:n.text, checked:want }) });
      if(r.status===404){
        showToast("task changed in the vault — refreshing");
        await fetchToday(); return;
      }
      if(!r.ok) throw new Error("HTTP "+r.status);
      todayData=await r.json(); todayFetchedAt=Date.now();
      renderToday();                       // re-render from the server's truth
    }catch(e){
      row.classList.toggle("done", n.checked);   // revert the optimistic flip
      showToast("couldn't update — check connection");
    }finally{
      toggling=false; row.classList.remove("pending");
    }
  }

  // ── outside list (and any `list` pin) ──
  // Fetch + render only. Never switches views — switchView() calls this when
  // the outside tab has no data, so switching from in here would recurse.
  async function openList(path, label){
    listPath=path; listLabel=label||path;
    outsideBody.innerHTML='<div class="tv-empty"><span class="glyph">⌗</span><p>Loading…</p></div>';
    try{
      const r=await api("/list?path="+encodeURIComponent(path));
      if(!r.ok) throw new Error("HTTP "+r.status);
      listData=await r.json();
      renderList();
      lastOk=Date.now(); setConn("online");
    }catch(e){
      outsideBody.innerHTML="";
      const box=el("div","tv-empty");
      $("outsideMeta").textContent="couldn't load";
      const p=el("p"); p.textContent="Couldn't load "+listLabel+".";
      const b=el("button","job"); b.textContent="retry";
      b.addEventListener("click",()=>openList(path,label));
      box.append(p,b); outsideBody.append(box);
    }
  }

  // entry point for anything that wants the outside tab showing a specific
  // note: point the view at it, then let switchView do the fetch
  function showList(path, label){
    if(path!==listPath) listData=null;
    listPath=path; listLabel=label||path;
    switchView("outside");
    if(!listData) openList(listPath, listLabel);
  }

  function renderList(){
    outsideBody.innerHTML="";
    const d=listData;
    if(!d) return;
    $("outsideTitle").textContent=listLabel==="outside"? "Outside" : listLabel;
    const items=(d.items||[]).filter(i=>!i.checked);
    $("outsideMeta").textContent=items.length
      ? plural(items.length,"errand")+" · while you're out"
      : (d.exists? "all clear" : "no list note yet");
    if(!items.length){
      const box=el("div","tv-empty");
      const g=el("span","glyph"); g.textContent="✓";
      const p=el("p"); p.textContent=d.exists? "Nothing to pick up." : "No list note yet.";
      box.append(g,p); outsideBody.append(box);
      const foot=el("div","vfoot"); foot.textContent=d.path; outsideBody.append(foot);
      return;
    }
    const panel=el("div","panel");
    for(const n of items) panel.append(taskRow(n,0,tickListItem));
    outsideBody.append(panel);
    const foot=el("div","vfoot"); foot.textContent=d.path; outsideBody.append(foot);
  }

  // Ticking is a cross-file MOVE on the server: the line is deleted here and
  // logged as done under today's section. So undo is a real inverse, not a
  // checkbox flip — hence the 5s window rather than a second tap.
  let ticking=false;
  async function tickListItem(row, n){
    if(ticking) return;
    ticking=true; row.classList.add("pending","done");
    try{
      const r=await api("/list/check",{ method:"POST",
        body:JSON.stringify({ path:listPath, text:n.text, checked:true }) });
      if(!r.ok) throw new Error("HTTP "+r.status);
      listData=await r.json();
      renderList();
      offerUndo(n.text);
    }catch(e){
      row.classList.remove("done");
      showToast("couldn't update — check connection");
    }finally{
      ticking=false; row.classList.remove("pending");
    }
  }

  function offerUndo(text){
    toast.innerHTML="";
    const s=el("span"); s.textContent="done · logged to today";
    const b=el("button","undo"); b.textContent="undo";
    b.addEventListener("click", async ()=>{
      toast.classList.remove("show");
      try{
        const r=await api("/list/check",{ method:"POST",
          body:JSON.stringify({ path:listPath, text, checked:false }) });
        if(!r.ok) throw new Error("HTTP "+r.status);
        listData=await r.json(); renderList();
        todayData=null;                 // the month file changed underneath
      }catch(e){ showToast("couldn't undo"); }
    });
    toast.append(s,b); toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer=setTimeout(()=>toast.classList.remove("show"), 5000);
  }

  $("todayRefresh").addEventListener("click",fetchToday);
  $("outsideRefresh").addEventListener("click",
    ()=>openList(listPath||cfg.outside||"outside-list.md", listLabel));
  document.querySelectorAll("#targets button").forEach(b=>
    b.addEventListener("click",()=>setComposeTarget(b.dataset.t)));

  // returning to the app with Today open → refresh if stale (e.g. after the
  // morning digest's "Today view" button, or checking boxes in Obsidian)
  document.addEventListener("visibilitychange",()=>{
    if(document.hidden) return;
    if(curView==="today" && Date.now()-todayFetchedAt > TODAY_STALE_MS) fetchToday();
    if(curView==="outside" && listPath) openList(listPath, listLabel);
  });

  // ── connectivity ───────────────────────
  window.addEventListener("online",()=>{ setConn("online"); flush(); });
  window.addEventListener("offline",()=>setConn("offline"));

  // ── boot ───────────────────────────────
  // the list views start closed — see switchView for why `hidden` alone
  // isn't enough to keep them off the capture screen
  for(const vw of [viewToday, viewOutside]){ vw.hidden=true; vw.style.display="none"; }
  // restore queued items into the session view so nothing feels lost
  for(const q of queue){ session.push({id:q.id, text:q.text, ts:q.ts, status:"queued"}); }
  setConn(navigator.onLine? "online":"offline");
  render(); renderPins(); autosize(); setComposeTarget(composeTarget);
  // #today deep link — /daily's 8am push lands here
  if(location.hash==="#today" && cfg.url) switchView("today");
  if(location.hash==="#outside" && cfg.url) switchView("outside");
  if(!cfg.url) setTimeout(openSheet, 350);
  flush();

  if("serviceWorker" in navigator){
    window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
  }
})();
</script>
</body>
</html>
